<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои дела</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      margin: 0; padding: 16px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    h2 { margin-top: 0; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input {
      flex: 1; padding: 12px; font-size: 16px; border-radius: 10px;
      border: 1px solid #8884; background: var(--tg-theme-secondary-bg-color, #f2f2f2);
      color: inherit;
    }
    button {
      padding: 12px 16px; font-size: 16px; border: 0; border-radius: 10px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; margin-bottom: 8px; border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    }
    li.done span { text-decoration: line-through; opacity: .5; }
    li span { flex: 1; cursor: pointer; }
    .del { background: transparent; color: #e53935; padding: 0 8px; }
  </style>
</head>
<body>
  <h2 id="title">Мои дела</h2>

  <div class="row">
    <input id="text" placeholder="Новая задача">
    <button id="add">+</button>
  </div>

  <ul id="list"></ul>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const name = tg.initDataUnsafe?.user?.first_name;
    if (name) document.getElementById("title").textContent = "Дела: " + name;

    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
      render();
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      tasks.forEach((t, i) => {
        const li = document.createElement("li");
        if (t.done) li.className = "done";

        const span = document.createElement("span");
        span.textContent = t.text;
        span.onclick = () => {
          tasks[i].done = !tasks[i].done;
          tg.HapticFeedback.impactOccurred("light");
          save();
        };

        const del = document.createElement("button");
        del.textContent = "✕";
        del.className = "del";
        del.onclick = () => { tasks.splice(i, 1); save(); };

        li.append(span, del);
        list.appendChild(li);
      });
    }

    document.getElementById("add").onclick = () => {
      const input = document.getElementById("text");
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = "";
      save();
    };

    render();
  </script>
</body>
</html>
