<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Для нас</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Шрифт Corbel: файлы лежат рядом с index.html */
    @font-face { font-family: "Corbel"; src: url("corbel.ttf")  format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Corbel"; src: url("corbelb.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Corbel"; src: url("corbeli.ttf") format("truetype"); font-weight: 400; font-style: italic; font-display: swap; }
    @font-face { font-family: "Corbel"; src: url("corbelz.ttf") format("truetype"); font-weight: 700; font-style: italic; font-display: swap; }

    :root {
      --bg: #0e1013;
      --surface: #f7faf3;
      --surface2: #e6f0dd;
      --sage: #d3e5c5;
      --line: rgba(52, 84, 38, .14);
      --text: #243a1b;
      --hint: #688060;
      --deep: #4b7335;
      --on: #f3f6ef;
      --on-hint: #c3cdb9;
      --accent: #e0647c;
      --accent-ink: #ffffff;
      --red: #d4574f;
      --yellow: #d9a23a;
      --green: #4fa774;
      --shadow: 0 8px 22px rgba(6, 16, 4, .22);
      --sans: "Corbel", "Segoe UI", -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      margin: 0; padding: 20px 16px 110px; min-height: 100vh;
      font-family: var(--sans); font-size: 16px; line-height: 1.4; color: var(--on);
      font-variant-numeric: lining-nums;
      background: transparent;
    }
    button { font-family: var(--sans); }

    /* Фон */
    #bg { position: fixed; inset: 0; z-index: 0; background: linear-gradient(160deg, #171a20, #0b0c0f); background-size: cover; background-position: center; }
    #bg.has-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(8, 9, 11, .45), rgba(8, 9, 11, .65)); }
    #app { position: relative; z-index: 1; animation: fade .25s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Верхняя строка */
    .topbar { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 10px; min-height: 40px; }
    .topactions { display: flex; gap: 8px; align-items: center; }
    .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-hint); background: transparent; border: 0; padding: 6px 4px; }
    .sync .sd { width: 7px; height: 7px; border-radius: 50%; }
    .iconbtn { width: 40px; height: 40px; border-radius: 14px; border: 0; background: var(--surface); color: var(--text); display: grid; place-items: center; padding: 0; box-shadow: var(--shadow); }
    .iconbtn svg { width: 19px; height: 19px; }
    .backlink { display: inline-flex; align-items: center; gap: 4px; color: var(--on-hint); background: none; border: 0; font-size: 14px; padding: 4px 0 12px; }

    h1, h2 { margin: 0; font-weight: 700; }
    h1.lead { font-size: 22px; line-height: 1.38; font-weight: 400; margin: 6px 0 22px; color: var(--on); }
    .page-title { font-size: 28px; line-height: 1.2; margin: 2px 0 6px; color: var(--on); }
    .sub { color: var(--on-hint); font-size: 14px; margin-bottom: 18px; line-height: 1.45; }
    .sheet .sub { color: var(--hint); }

    /* Счётчик */
    .together { padding: 22px 20px; margin-bottom: 20px; border-radius: 26px; background: linear-gradient(150deg, #f8fbf4, #d9e9cc); color: var(--text); box-shadow: var(--shadow); }
    .together .lbl { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--hint); font-weight: 700; }
    .together .bignum { margin: 8px 0 4px; display: flex; align-items: baseline; }
    .together .num { font-size: 60px; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
    .together .unit { font-size: 19px; color: var(--accent); margin-left: 10px; font-weight: 700; }
    .together .ymd { color: var(--hint); font-size: 15px; }
    .together .next { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--hint); }

    /* Приглашение */
    .invite { padding: 16px 18px; margin-bottom: 20px; border-radius: 22px; background: var(--surface); color: var(--text); border-left: 5px solid var(--accent); box-shadow: var(--shadow); }
    .invite .lbl { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    .invite .name { font-weight: 700; font-size: 17px; margin: 6px 0 4px; }

    /* Плитки главного экрана */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
    .tiles.three { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tile { display: flex; flex-direction: column; gap: 12px; text-align: left; min-height: 140px; padding: 16px 15px 14px; border: 0; border-radius: 26px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); cursor: pointer; animation: rise .35s ease both; transition: transform .12s ease; }
    .tile:active { transform: scale(.97); }
    .tile.sage { background: var(--sage); }
    .tile .ico { background: var(--sage); color: var(--deep); border: 0; }
    .tile.sage .ico { background: rgba(255, 255, 255, .72); }
    .tile .name { font-weight: 700; font-size: 16px; line-height: 1.25; word-break: break-word; }
    .tile .meta { margin-top: auto; font-size: 12.5px; color: var(--hint); line-height: 1.3; }
    .tiles.three .tile { min-height: 118px; padding: 14px 12px 12px; border-radius: 22px; gap: 10px; }
    .tiles.three .tile .name { font-size: 14px; }
    .tiles.three .tile .meta { font-size: 11.5px; }

    /* Карточки */
    .card {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); color: var(--text);
      border-radius: 22px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
      box-shadow: var(--shadow);
      transition: background .15s ease, opacity .2s;
      animation: rise .35s ease both;
    }
    .card:active { background: var(--surface2); }
    .card.used { opacity: .55; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .ico { width: 44px; height: 44px; border-radius: 15px; flex: none; display: grid; place-items: center; background: var(--sage); border: 0; color: var(--deep); }
    .ico.sm { width: 38px; height: 38px; border-radius: 13px; }
    .ico.on { background: var(--accent); color: #fff; }
    .ico svg { width: 22px; height: 22px; }
    .ico.sm svg { width: 18px; height: 18px; }
    .card .body { flex: 1; min-width: 0; }
    .card .name { font-weight: 700; font-size: 16px; line-height: 1.3; word-break: break-word; }
    .card .meta { color: var(--hint); font-size: 13px; margin-top: 3px; }
    .card .arrow { color: var(--hint); display: grid; place-items: center; }
    .card .arrow svg { width: 18px; height: 18px; }
    .note { color: var(--hint); font-size: 14px; margin-top: 6px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
    .empty { color: var(--on-hint); text-align: center; padding: 34px 10px; line-height: 1.5; }

    /* Кнопки */
    .fab {
      position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
      padding: 16px; font-size: 17px; font-weight: 700; border: 0; border-radius: 20px;
      color: var(--accent-ink); background: var(--accent); z-index: 5;
      box-shadow: 0 10px 24px rgba(224, 100, 124, .38);
    }
    .fab:active { opacity: .9; }
    .btn { padding: 13px 16px; font-size: 15px; font-weight: 700; border: 0; border-radius: 16px; color: var(--accent-ink); background: var(--accent); }
    .btn:active { opacity: .88; }
    .btn.ghost { background: var(--sage); color: var(--text); }
    .btn.danger { background: #c2433c; color: #fff; }
    .btn.small { padding: 9px 13px; font-size: 13px; border-radius: 12px; white-space: nowrap; }
    .btn.wide { width: 100%; }
    .row { display: flex; gap: 10px; margin-bottom: 8px; }
    .row .btn { flex: 1; }
    .section-title { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--on-hint); font-weight: 700; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, .2); }
    .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 10px; background: rgba(224, 100, 124, .14); color: #c24a63; margin-top: 6px; }
    .linkbtn { background: none; border: 0; color: var(--on-hint); font-size: 13px; text-decoration: underline; padding: 10px; width: 100%; }
    .sheet .linkbtn { color: var(--hint); }

    /* Цветовые метки */
    .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }
    .legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--hint); background: var(--surface); border-radius: 18px; padding: 12px 14px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .legend div { display: flex; align-items: center; gap: 10px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding: 9px 15px; border-radius: 14px; border: 0; background: var(--surface); color: var(--text); font-size: 14px; }
    .chip.active { background: var(--deep); color: #fff; font-weight: 700; }

    /* Галочка */
    .check { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.8px solid var(--hint); color: #fff; background: transparent; padding: 0; }
    .check.on { background: var(--accent); border-color: var(--accent); }
    .check svg { width: 16px; height: 16px; }
    .strike { text-decoration: line-through; opacity: .6; }

    /* Причины */
    .reason-card { margin: 4px 0 14px; padding: 24px 20px; border-radius: 26px; min-height: 150px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); border-left: 5px solid var(--accent); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
    .reason-card.pop { animation: rise .35s ease; }
    .reason-num { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; min-height: 15px; }
    .reason-text { font-size: 22px; line-height: 1.4; font-style: italic; }

    /* Фото */
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photo { aspect-ratio: 1; border-radius: 16px; overflow: hidden; cursor: pointer; background: var(--sage); }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .viewer { position: fixed; inset: 0; background: rgba(6, 7, 9, .97); z-index: 30; display: flex; flex-direction: column; animation: fade .2s ease; }
    .viewer .stage { flex: 1; display: grid; place-items: center; padding: 12px; min-height: 0; }
    .viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    .viewer .bar { display: flex; gap: 8px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
    .viewer .bar .btn { flex: 1; }
    .viewer .btn.ghost { background: rgba(255, 255, 255, .14); color: #fff; }
    .counter { text-align: center; color: var(--on-hint); font-size: 13px; padding-top: 14px; }

    /* Окно формы */
    .overlay { position: fixed; inset: 0; background: rgba(6, 12, 4, .55); z-index: 20; display: flex; align-items: flex-end; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
    .sheet { width: 100%; max-height: 92vh; overflow-y: auto; background: #fbfdf8; color: var(--text); border-radius: 28px 28px 0 0; padding: 24px 18px calc(24px + env(safe-area-inset-bottom)); animation: slide .25s ease; }
    @keyframes slide { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet h3 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
    label { display: block; font-size: 13px; color: var(--hint); margin: 14px 0 6px; }
    input, textarea, select { width: 100%; padding: 13px 14px; font-family: var(--sans); font-size: 16px; border-radius: 14px; border: 1.5px solid transparent; background: var(--surface2); color: var(--text); color-scheme: light; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; }
    input::placeholder, textarea::placeholder { color: rgba(36, 58, 27, .38); }
    select option { background: #fff; color: #243a1b; }
    textarea { min-height: 96px; resize: vertical; }
    .levels { display: flex; gap: 8px; }
    .level { flex: 1; padding: 12px 6px; border-radius: 14px; border: 2px solid transparent; background: var(--surface2); color: var(--text); font-size: 13px; text-align: center; }
    .level.sel.red { border-color: var(--red); background: #fbe7e5; }
    .level.sel.yellow { border-color: var(--yellow); background: #fbf1d9; }
    .level.sel.green { border-color: var(--green); background: #e1f3e8; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    .actions .btn { flex: 1; }
    .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 60; max-width: 90%; text-align: center; background: #243a1b; color: #fff; padding: 11px 18px; border-radius: 16px; font-size: 14px; font-weight: 700; box-shadow: 0 8px 22px rgba(0, 0, 0, .35); }

    /* Выбор фона */
    .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 14px; border: 2.5px solid transparent; color: #fff; font-size: 11px; display: flex; align-items: flex-end; justify-content: center; padding: 6px 2px; }
    .swatch.sel { border-color: var(--accent); }
    .swatch.photo-sw { background-size: cover; background-position: center; }

    /* PIN */
    .pin-wrap { text-align: center; padding-top: 10px; }
    .pin-wrap .lock { color: var(--on); display: grid; place-items: center; }
    .pin-wrap .lock svg { width: 34px; height: 34px; }
    .pin-dots { display: flex; justify-content: center; gap: 16px; margin: 18px 0 26px; }
    .pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 1.8px solid var(--on); }
    .pin-dots span.on { background: var(--on); }
    .pin-dots.shake { animation: shake .4s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 290px; margin: 0 auto; }
    .key { height: 60px; border-radius: 20px; border: 0; background: var(--surface); color: var(--text); font-size: 23px; box-shadow: var(--shadow); }
    .key:active { background: var(--sage); }
    .key.empty { visibility: hidden; }

    /* Приветствие */
    .welcome { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; background: linear-gradient(160deg, #1d2a1c, #0b100a); color: var(--on); animation: fade .5s ease; }
    .welcome h1 { font-size: 36px; line-height: 1.15; margin: 0 0 12px; }
    .welcome p { font-size: 19px; line-height: 1.5; margin: 0 0 36px; color: var(--on-hint); font-style: italic; max-width: 320px; }
    .welcome .btn { padding: 16px 40px; font-size: 16px; border-radius: 20px; }
  </style>
</head>
<body>
  <div id="bg"></div>

  <script>

      initData: "", initDataUnsafe: {},
      ready() {}, expand() {}, setHeaderColor() {}, setBackgroundColor() {},
      BackButton: { onClick() {}, show() {}, hide() {} },

      openLink(u) { window.open(u, "_blank"); },
      openTelegramLink(u) { window.open(u, "_blank"); }
    };
    tg.ready();
    tg.expand();

    // =====================================================================
    //   НАСТРОЙКИ И СОДЕРЖИМОЕ (можно менять в коде)
    // =====================================================================
    const START = "2025-08-13"; // дата начала отношений (ГГГГ-ММ-ДД)

    // Адрес сервера (Cloudflare Worker), например "https://diary-api.твой-ник.workers.dev"

    const WELCOME_TEXT = "Добро пожаловать в наш виртуальный дневник";

    const SECTIONS = {

      coupons: { icon: "ticket",   title: "Купоны любви" },
      letters: { icon: "mail",     title: "Письма в будущее" }
    };

    const LEVELS = {

      yellow: { name: "Жёлтый",  hint: "не сильно, но желательно" },
      green:  { name: "Зелёный", hint: "предпочтительно, но можно и без этого" }

    // Варианты фона (выбирает только Иса; можно ещё загрузить своё фото)
    const BG_PRESETS = [

    ];

    const REASONS = [
      "Твоя улыбка, которая поднимает мне настроение",
      "Твои глаза, которые дают видение будущего",
      "Твоя целеустремлённость, которая вдохновляет меня",
      "Твоя энергетика, которая цепляет меня",
      "Твоя фигура, которая возбуждает меня",
      "Твоя любовь, которая заставляет меня жить",

      "Твоё воспитание, которое подаёт пример"
    ];

    // id менять не нужно: по нему запоминается, что купон использован
    const COUPONS = [

      { id: "c_kiss",       title: "Купон на поцелуй" },
      { id: "c_hugs",       title: "Купон на обнимашки" },
      { id: "c_sex",        title: "Купон на секс" },
      { id: "c_restaurant", title: "Купон на поход в ресторан" },
      { id: "c_park",       title: "Купон на прогулку по парку" },
      { id: "c_massage",    title: "Купон на массаж" },
      { id: "c_movie",      title: "Купон на просмотр фильма" }
    ];

    // Даты, которые добавятся при первом запуске
    const SEED_DATES = [
      { id: "seed_anniv",  title: "Наша годовщина",             date: START,        repeat: "yearly", note: "День, когда всё началось" },
      { id: "seed_bd_isa", title: "День рождения Исы",          date: "2005-08-16", repeat: "yearly", note: "" },
      { id: "seed_bd_mak", title: "День рождения " + HER,       date: "2006-03-20", repeat: "yearly", note: "" }
    ];

    // Письма, которые лежат в приложении с самого начала.
    // Пример: { id: "seed_l1", title: "Открой в годовщину", from: "isa", openDate: "2026-08-13", text: "Текст письма" }
    // from: "isa" (от Исы) или "her" (от второго человека)
    const SEED_LETTERS = [];

    // =====================================================================
    //   ДАННЫЕ
    // =====================================================================
    const KEY = "isa_makosh_v1";
    const SNAP_KEY = "sync_snap_v1", SINCE_KEY = "sync_since_v1", INIT_KEY = "sync_init_v1";

    function defaultState() {
      const trips = [];
      for (let i = 1; i <= 10; i++) {
        trips.push({ id: "t" + i, title: "Поездка " + i, place: "", when: "", notes: "", memories: [], photoCount: 0 });

      return {
        dates: [], trips: trips, prefs: { our: [], isa: [], makosh: [] },
        letters: [], wishes: [], gifts: [], reasons: [], coupons: [],
        couponUsed: {}, seeded: [], settings: { bg: null }

    function migrate(st) {
      st.letters.forEach(l => { if (l.from === "Иса") l.from = "isa"; else if (isHer(l.from)) l.from = "her"; });
      st.gifts.forEach(g => { if (g.for === "Иса") g.for = "isa"; else if (isHer(g.for)) g.for = "her"; });
      st.dates.forEach(d => {
        if (d.id === "seed_bd_mak" && d.title === "День рождения Макош") d.title = "День рождения " + HER;

        const raw = localStorage.getItem(KEY);
        if (raw) {
          const s = JSON.parse(raw);
          const st = Object.assign({}, d, s);
          delete st.songs;
          st.prefs = Object.assign(d.prefs, s.prefs || {});
          ["dates", "trips", "letters", "wishes", "gifts", "reasons", "coupons", "seeded"].forEach(k => {
            if (!Array.isArray(st[k])) st[k] = d[k];
          });
          if (!st.couponUsed || typeof st.couponUsed !== "object") st.couponUsed = {};
          if (!st.settings || typeof st.settings !== "object") st.settings = { bg: null };
          st.trips.forEach(t => { if (typeof t.photoCount !== "number") t.photoCount = 0; if (!t.memories) t.memories = []; });
          migrate(st);

        }

            const s = r.result.createObjectStore("photos", { keyPath: "id" });
            s.createIndex("tripId", "tripId");

    function tx(mode, fn) {
      return db().then(d => new Promise((resolve, reject) => {
        const t = d.transaction("photos", mode);
        const req = fn(t.objectStore("photos"));
        t.oncomplete = () => resolve(req ? req.result : undefined);
        t.onerror = () => reject(t.error);
      }));
    }

    const getPhotos = ownerId => tx("readonly", s => s.index("tripId").getAll(ownerId));

    function resizeImage(file, max, quality) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(b => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error("blob")); }, "image/jpeg", quality || 0.82);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
        img.src = url;
      });
    }

      children.flat().forEach(c => {

        e.append(c.nodeType ? c : document.createTextNode(c));
      });
      return e;

    function pad2(n) { return String(n).padStart(2, "0"); }

    function plural(n, forms) {
      const a = Math.abs(n) % 100, b = a % 10;
      if (a > 10 && a < 20) return forms[2];

      if (b === 1) return forms[0];

    function daysUntil(item) {
      if (!item.date) return null;
      const [y, m, d] = item.date.split("-").map(Number);
      const today = todayMid();
      let target = new Date(y, m - 1, d);
      if (item.repeat === "yearly") {
        target = new Date(today.getFullYear(), m - 1, d);
        if (target < today) target = new Date(today.getFullYear() + 1, m - 1, d);
      }
      return Math.round((target - today) / 86400000);
    }

      let y = b.getFullYear() - a.getFullYear();

      if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
      if (m < 0) { y--; m += 12; }
      return { y, m, d };

    function stable(v) {
      if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
      if (v && typeof v === "object") {
        return "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";

    // Превращаем все данные в плоский список записей: ключ "раздел:id"
    function flatten() {
      const f = {};
      const put = (col, o) => {
        const d = Object.assign({}, o);
        delete d.photoCount;
        if (col === "trips") delete d.memories;
        f[col + ":" + o.id] = { col: col, id: o.id, data: d };
      };
      state.dates.forEach(o => put("dates", o));
      state.trips.forEach(t => {
        put("trips", t);
        (t.memories || []).forEach(m => {
          f["memories:" + m.id] = { col: "memories", id: m.id, data: { id: m.id, tripId: t.id, text: m.text } };
        });
      });
      ["our", "isa", "makosh"].forEach(k => (state.prefs[k] || []).forEach(o => put("prefs_" + k, o)));
      state.reasons.forEach(o => put("reasons", o));
      state.coupons.forEach(o => put("coupons", o));
      state.letters.forEach(o => put("letters", o));
      state.wishes.forEach(o => put("wishes", o));
      Object.keys(state.couponUsed).forEach(cid => {
        f["couponUsed:cu_" + cid] = { col: "couponUsed", id: "cu_" + cid, data: { cid: cid, on: state.couponUsed[cid] } };
      });
      if (state.settings && state.settings.bg) {
        f["settings:bg"] = { col: "settings", id: "bg", data: state.settings.bg };
      }
      return f;
    }

    function listFor(col) {
      if (col.indexOf("prefs_") === 0) return state.prefs[col.slice(6)] || null;
      return { dates: state.dates, trips: state.trips, reasons: state.reasons, coupons: state.coupons,
               letters: state.letters, wishes: state.wishes }[col] || null;
    }

    // Обновляем объект «на месте», чтобы открытые окна не потеряли ссылку на запись
    function assignInPlace(target, src) {
      Object.keys(target).forEach(k => delete target[k]);
      Object.assign(target, src);
    }

    // Применяем запись, пришедшую с сервера
    function applyRemote(it) {
      const d = it.data || {};
      if (it.col === "settings") {
        if (it.id !== "bg") return;
        state.settings.bg = it.deleted ? null : d;
        return;
      }
      if (it.col === "couponUsed") {
        if (it.deleted) delete state.couponUsed[d.cid]; else state.couponUsed[d.cid] = d.on;
        return;
      }
      if (it.col === "memories") {
        const trip = state.trips.find(t => t.id === d.tripId);
        if (!trip) return;
        const i = trip.memories.findIndex(m => m.id === it.id);
        if (it.deleted) { if (i >= 0) trip.memories.splice(i, 1); }
        else if (i >= 0) trip.memories[i].text = d.text;
        else trip.memories.push({ id: it.id, text: d.text });
        return;
      }
      const list = listFor(it.col);
      if (!list) return;
      const i = list.findIndex(x => x.id === it.id);
      if (it.deleted) { if (i >= 0) list.splice(i, 1); return; }
      const obj = Object.assign({}, d);
      if (it.col === "trips") obj.memories = i >= 0 ? list[i].memories : [];
      if (it.col === "trips" || it.col === "wishes") obj.photoCount = (i >= 0 && list[i].photoCount) || 0;
      if (i >= 0) assignInPlace(list[i], obj); else list.push(obj);
    }

    function labelFor(rec) {
      const d = rec.data || {};
      switch (rec.col) {
        case "dates": case "trips": case "coupons": return d.title || "";
        case "wishes": return d.text || "";
        case "memories": { const t = state.trips.find(x => x.id === d.tripId); return t ? t.title : ""; }
        case "couponUsed": { const c = COUPONS.concat(state.coupons).find(x => x.id === d.cid); return c ? c.title : ""; }
        default: return String(d.text || d.title || "").slice(0, 80);
      }
    }

    async function pull(initial) {
      const since = initial ? 0 : Number(localStorage.getItem(SINCE_KEY) || 0);
      const res = await (await apiFetch("/api/sync?since=" + since)).json();
      const snap = getSnap();
      const flat = flatten();
      const known = new Set();
      let changed = false;
      // сначала всё, кроме воспоминаний, чтобы поездки уже существовали
      const items = res.items.filter(i => i.col !== "memories").concat(res.items.filter(i => i.col === "memories"));
      items.forEach(it => {
        known.add(it.id);
        const key = it.col + ":" + it.id;
        const mine = flat[key];
        // есть мои неотправленные правки: не затираем их
        const pending = !initial && mine && snap[key] !== stable(mine.data);
        if (pending) return;
        if (it.deleted) {
          if (mine) changed = true;
          applyRemote(it);
          delete snap[key];
          return;
        }
        const s = stable(it.data);
        if (snap[key] === s && !initial) return;
        applyRemote(it);
        snap[key] = s;
        changed = true;
      });
      setSnap(snap);
      try { localStorage.setItem(SINCE_KEY, String(Math.max(0, res.now - 2000))); } catch (e) {}
      lastKnownIds = known;
      if (changed) { persist(); afterRemoteChange(); }
    }

    function afterRemoteChange() {
      const cur = stack[stack.length - 1];
      if (cur.name !== "gifts") render();
      if (stable(state.settings.bg || null) !== lastBgKey) applyBackground();
    }

    async function pushDiff(silent) {
      const flat = flatten(), snap = getSnap();
      const ops = [];
      Object.keys(flat).forEach(key => {
        const rec = flat[key];
        if (snap[key] !== stable(rec.data)) ops.push({ op: "put", col: rec.col, id: rec.id, data: rec.data, label: labelFor(rec) });
      });
      Object.keys(snap).forEach(key => {
        if (!(key in flat)) { const i = key.indexOf(":"); ops.push({ op: "del", col: key.slice(0, i), id: key.slice(i + 1) }); }
      });
      for (let i = 0; i < ops.length; i += 25) {
        const chunk = ops.slice(i, i + 25);
        await apiFetch("/api/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ops: chunk, silent: !!silent })
        });
        const sn = getSnap();
        chunk.forEach(o => {
          const key = o.col + ":" + o.id;
          if (o.op === "put") sn[key] = stable(o.data); else delete sn[key];
        });
        setSnap(sn);
      }
    }

    async function uploadPhoto(ownerId, id, full, thumb, ts) {
      await apiFetch("/api/photo?owner=" + encodeURIComponent(ownerId) + "&id=" + encodeURIComponent(id) +
        "&ts=" + ts + "&tl=" + thumb.size, {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream" },
        body: new Blob([thumb, full])
      });
    }

    // Фото, добавленные раньше на этом устройстве, переносим на сервер
    async function migrateLocalPhotos() {
      if (localStorage.getItem("photos_migrated_v1")) return;
      let all = [];
      try { all = await tx("readonly", s => s.getAll()); } catch (e) { all = []; }
      for (const p of all) {
        try {
          const thumb = await resizeImage(p.blob, 360, 0.75);
          await uploadPhoto(p.tripId, p.id, p.blob, thumb, p.ts || Date.now());
          await delPhoto(p.id);
        } catch (e) { return; }
      }
      try { localStorage.setItem("photos_migrated_v1", "1"); } catch (e) {}
    }

    async function initialSync() {
      await pull(true);
      applySeeds(lastKnownIds);
      await migrateLocalPhotos();
      await pushDiff(true);
      localStorage.setItem(INIT_KEY, "1");
      afterRemoteChange();
    }

    let syncing = false, again = false;
    async function syncNow() {
      if (!SYNC_ON) return;
      if (syncing) { again = true; return; }
      syncing = true;
      setSyncUI("busy");
      try {
        if (!localStorage.getItem(INIT_KEY)) { await initialSync(); refreshPhotoCounts(true); }
        else { await pull(false); await pushDiff(false); }
        lastSyncError = "";
        setSyncUI("ok");
        const pn = stack[stack.length - 1].name;
        if (pn === "home" || pn === "trips" || pn === "wishes") refreshPhotoCounts();
        if (role === "isa" && partnerLinked !== true) fetchRole();
      } catch (e) {
        const code = String(e && e.message || "");
        lastSyncError = code;
        setSyncUI(code === "401" || code === "403" ? "denied" : "err");
      } finally {
        syncing = false;
        if (again) { again = false; setTimeout(syncNow, 300); }
      }
    }

    const SYNC_LABELS = {
      ok: ["#4fa774", "синхронизировано"], busy: ["#d9a23a", "синхронизация…"],
      err: ["#d4574f", "нет связи"], denied: ["#d4574f", "нет доступа"]
    };
    function setSyncUI(kind) {
      const was = syncState;
      syncState = kind;
      updateSyncEl();
      // Если выяснилось, что доступа нет, перерисуем главную, чтобы показать подсказку
      if (kind === "denied" && was !== "denied" && stack[stack.length - 1].name === "home") render();
    }
    function updateSyncEl() {
      const el = document.getElementById("syncdot");
      if (!el) return;
      const m = SYNC_LABELS[syncState];
      el.innerHTML = "";
      el.append(h("span", { class: "sd", style: "background:" + m[0] }), m[1]);
    }
    function onSyncClick() {
      if (syncState === "denied") toast("Нет доступа. Открой дневник по ссылке-приглашению от Исы", 4000);
      else if (syncState === "err") toast("Нет связи с сервером" + (lastSyncError ? " (" + lastSyncError + ")" : ""), 3000);
      else toast("Всё синхронизировано", 1500);
      syncNow();
    }

    // Кто я (Иса или второй человек) и подключена ли она. Для Исы сервер ещё даёт ссылку-приглашение
    let partnerLinked = null, inviteLink = "";
    async function fetchRole() {
      try {
        const r = await (await apiFetch("/api/me")).json();
        let changed = false;
        if (r.key && r.key !== role) {
          role = r.key;
          try { localStorage.setItem("role_v1", role); } catch (e) {}
          changed = true;
        }
        const linked = !!r.linked, link = r.invite || "";
        if (linked !== partnerLinked || link !== inviteLink) { partnerLinked = linked; inviteLink = link; changed = true; }
        if (changed && stack[stack.length - 1].name === "home") render();
      } catch (e) {}
    }

    function shareInvite() {
      const u = "https://t.me/share/url?url=" + encodeURIComponent(inviteLink) + "&text=" + encodeURIComponent("Это для тебя");
      try { tg.openTelegramLink(u); } catch (e) { openLink(u); }
    }
    function copyInvite() {
      const ok = () => toast("Ссылка скопирована", 1600);
      const fail = () => toast("Не удалось скопировать, нажми «Отправить ей»", 2600);
      try { navigator.clipboard.writeText(inviteLink).then(ok, fail); } catch (e) { fail(); }
    }

    // Количество фото в карточках обновляем отдельным лёгким запросом
    let lastCountFetch = 0;
    async function refreshPhotoCounts(force) {
      if (!REMOTE) return;
      if (!force && Date.now() - lastCountFetch < 20000) return;
      lastCountFetch = Date.now();
      try {
        const r = await (await apiFetch("/api/photocounts")).json();
        const counts = r.counts || {};
        let changed = false;
        state.trips.concat(state.wishes).forEach(o => {
          const c = counts[o.id] || 0;
          if ((o.photoCount || 0) !== c) { o.photoCount = c; changed = true; }
        });
        if (changed) {
          persist();
          const n = stack[stack.length - 1].name;
          if (n === "home" || n === "trips" || n === "wishes") render();
        }
      } catch (e) {}
    }

    function startSync() {
      if (!SYNC_ON) return;
      fetchRole();
      syncNow();
      setInterval(() => { if (!document.hidden) syncNow(); }, 12000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
    }

    // Фото: на сервере (если подключён) или на устройстве
    const photoApi = {
      async list(ownerId) {
        if (REMOTE) { const r = await apiFetch("/api/photos?owner=" + encodeURIComponent(ownerId)); return (await r.json()).photos || []; }
        const l = await getPhotos(ownerId);
        return l.map(p => ({ id: p.id, ts: p.ts }));
      },
      async url(id, size) {
        if (!REMOTE) {
          const rec = await tx("readonly", s => s.get(id));
          return URL.createObjectURL(rec.blob);
        }
        const path = "/api/photo/" + encodeURIComponent(id) + "?size=" + size;
        const key = API_BASE + path;
        let resp = null, cache = null;
        try { cache = await caches.open("isa-photos-v1"); resp = await cache.match(key); } catch (e) {}
        if (!resp) {
          resp = await apiFetch(path);
          if (cache) { try { await cache.put(key, resp.clone()); } catch (e) {} }
        }
        return URL.createObjectURL(await resp.blob());
      },
      // возвращает id добавленного фото
      async add(ownerId, file, opts) {
        opts = opts || {};
        const id = uid();
        if (!REMOTE) {
          const blob = await resizeImage(file, opts.max || 1280, opts.quality || 0.82);
          await putPhoto({ id: id, tripId: ownerId, blob: blob, ts: Date.now() });
          return id;
        }
        const full = await resizeImage(file, opts.max || 1280, opts.quality || 0.82);
        const thumb = await resizeImage(file, 360, 0.75);
        await uploadPhoto(ownerId, id, full, thumb, Date.now());
        return id;
      },
      async remove(id) {
        if (REMOTE) await apiFetch("/api/photo/" + encodeURIComponent(id), { method: "DELETE" });
        else await delPhoto(id);
      },
      notify(count, label) {
        if (!REMOTE) return;
        apiFetch("/api/notify", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: "photos", count: count, label: label })
        }).catch(() => {});
      }
    };

    // =====================================================================
    //   НАВИГАЦИЯ
    // =====================================================================
    let stack = [{ name: "home" }];
    let photoUrls = [];
    let giftsUnlocked = false;

    function go(name, param) { lastCountFetch = 0; stack.push({ name, param }); render(); window.scrollTo(0, 0); }
    function back() { if (stack.length > 1) { stack.pop(); render(); window.scrollTo(0, 0); } }
    tg.BackButton.onClick(back);

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = "";
      app.style.animation = "none"; void app.offsetWidth; app.style.animation = "";
      document.querySelectorAll(".fab").forEach(e => e.remove());
      photoUrls.forEach(u => URL.revokeObjectURL(u)); photoUrls = [];
      const cur = stack[stack.length - 1];
      if (cur.name !== "gifts") giftsUnlocked = false;

      if (stack.length > 1) tg.BackButton.show(); else tg.BackButton.hide();
      // Вне Telegram своей кнопки «назад» нет, поэтому рисуем её сами
      if (stack.length > 1 && !tg.initData) {
        app.append(h("button", { class: "backlink", onclick: back }, ic("back"), "Назад"));
        app.lastChild.firstChild.style.cssText = "width:16px;height:16px";
      }

      const pages = {
        home: renderHome, dates: renderDates, trips: renderTrips, trip: renderTrip, prefs: renderPrefs,
        reasons: renderReasons, coupons: renderCoupons, letters: renderLetters,
        wishes: renderWishes, wish: renderWish, gifts: renderGifts
      };
      (pages[cur.name] || renderHome)(app, cur.param);
      if (cur.name === "home" || cur.name === "trips" || cur.name === "wishes") refreshPhotoCounts();
    }

    function addFab(text, onclick) { document.body.append(h("button", { class: "fab", onclick }, text)); }
    function delay(i) { return "animation-delay:" + (i * 0.04) + "s"; }

    // =====================================================================
    //   ПРИВЕТСТВИЕ
    // =====================================================================
    function showWelcome() {
      const w = h("div", { class: "welcome" },
        h("h1", {}, WELCOME_TITLE),
        h("p", {}, WELCOME_TEXT),
        h("button", { class: "btn", onclick: () => {
          try { localStorage.setItem("welcomed_v1", "1"); } catch (e) {}
          haptic("medium");
          w.style.transition = "opacity .4s"; w.style.opacity = "0";
          setTimeout(() => w.remove(), 400);
        } }, "Войти"));

    // =====================================================================
    //   ГЛАВНЫЙ ЭКРАН
    // =====================================================================
    function renderTogether(app) {
      const start = parseISO(START);
      const today = todayMid();
      const total = Math.round((today - start) / 86400000);
      if (total < 0) return;
      const { y, m, d } = diffYMD(start, today);
      const parts = [];
      if (y > 0) parts.push(y + " " + plural(y, ["год", "года", "лет"]));
      if (m > 0) parts.push(m + " " + plural(m, ["месяц", "месяца", "месяцев"]));
      if (d > 0) parts.push(d + " " + plural(d, ["день", "дня", "дней"]));
      const n = daysUntil({ date: START, repeat: "yearly" });

      app.append(h("div", { class: "together" },
        h("div", { class: "lbl" }, "Мы вместе"),
        h("div", { class: "bignum" }, h("span", { class: "num" }, String(total)), h("span", { class: "unit" }, plural(total, ["день", "дня", "дней"]))),
        parts.length ? h("div", { class: "ymd" }, parts.join(" · ")) : null,
        h("div", { class: "next" }, n === 0 ? "Сегодня наша годовщина" : "До годовщины: " + n + " " + plural(n, ["день", "дня", "дней"]))));
    }

      return h("button", { class: "tile" + (sage ? " sage" : ""), style: delay(i), onclick: () => {
        haptic();
        if (key === "isa" || key === "makosh") go("prefs", key);
        else go(key);
      } },
        iconBox(s.icon),
        h("div", { class: "name" }, s.title),
        h("div", { class: "meta" }, meta));
    }

    function renderHome(app) {
      const actions = h("div", { class: "topactions" });
      if (SYNC_ON) { actions.append(h("button", { id: "syncdot", class: "sync", onclick: onSyncClick })); }
      if (canEditBg()) actions.append(h("button", { class: "iconbtn", "aria-label": "Оформление", onclick: () => { haptic(); openBgSheet(); } }, ic("sliders")));
      app.append(h("div", { class: "topbar" }, actions));
      updateSyncEl();

      app.append(h("h1", { class: "lead" }, "Это приложение создано для нашего удобства и заботы друг о друге ❤️"));

      // Иса: пока второй человек не подключён, показываем приглашение
      if (SYNC_ON && role === "isa" && partnerLinked === false) {
        app.append(h("div", { class: "invite" },
          h("div", { class: "lbl" }, "Подключение"),
          h("div", { class: "name" }, HER + " ещё не подключена"),
          h("div", { class: "note", style: "margin:0 0 14px" }, inviteLink
            ? "Отправь ей эту ссылку. Ей нужно только нажать на неё и на кнопку Start: без регистрации и без поиска ID."
            : "Ссылка пока недоступна. Отправь боту команду /invite."),
          inviteLink ? h("div", { class: "row", style: "margin:0" },

            h("button", { class: "btn ghost", onclick: copyInvite }, "Скопировать")) : null));
      }
      // Тот, кто открыл без приглашения
      if (SYNC_ON && syncState === "denied") {
        app.append(h("div", { class: "invite" },
          h("div", { class: "lbl" }, "Нет доступа"),
          h("div", { class: "note", style: "margin:6px 0 0" }, "Открой дневник по ссылке-приглашению от Исы: нажми на неё и на кнопку Start.")));
      }

      renderTogether(app);

      const filledTrips = state.trips.filter(t => t.place || t.when || t.notes || t.memories.length || t.photoCount).length;
      const usedCoupons = COUPONS.concat(state.coupons).filter(c => state.couponUsed[c.id]).length;
      const totalCoupons = COUPONS.length + state.coupons.length;
      const doneWishes = state.wishes.filter(w => w.done).length;

      const tiles = h("div", { class: "tiles" });
      const list = [
        ["dates", "Записей: " + state.dates.length],
        ["trips", "Заполнено: " + filledTrips + " из " + state.trips.length],
        ["isa", "Записей: " + state.prefs.isa.length],
        ["makosh", "Записей: " + state.prefs.makosh.length],
        ["wishes", "Сделано: " + doneWishes + " из " + state.wishes.length],
        ["gifts", "Закрыто PIN-кодом"]
      ];
      list.forEach((x, n) => tiles.append(homeCard(x[0], x[1], n, n % 4 === 0 || n % 4 === 3)));
      app.append(tiles);

      app.append(h("div", { class: "section-title" }, "Маленькие сюрпризы"));
      const small = h("div", { class: "tiles three" });
      small.append(homeCard("reasons", "Причин: " + (REASONS.length + state.reasons.length), 6));
      small.append(homeCard("coupons", "Использовано: " + usedCoupons + " из " + totalCoupons, 7));
      small.append(homeCard("letters", "Писем: " + state.letters.length, 8));
      app.append(small);

    // =====================================================================
    //   ВАЖНЫЕ ДАТЫ
    // =====================================================================
    const DATE_FIELDS = [
      { key: "title", label: "Название", placeholder: "Например: День рождения", required: true },
      { key: "date", label: "Дата", type: "date" },
      { key: "repeat", label: "Повтор", type: "select", options: [["", "Не повторяется"], ["yearly", "Каждый год"]] },
      { key: "note", label: "Заметка", type: "textarea", placeholder: "Что важно помнить" }
    ];

    function renderDates(app) {
      app.append(h("h2", { class: "page-title" }, SECTIONS.dates.title));
      app.append(h("div", { class: "sub" }, "Ближайшие даты показаны первыми"));

        app.append(h("div", { class: "empty" }, "Пока пусто.", h("br"), "Добавь первую дату кнопкой ниже."));
      }

      const sorted = state.dates.slice().sort((a, b) => {
        const da = daysUntil(a), db2 = daysUntil(b);
        if (da === null) return 1; if (db2 === null) return -1;

        if (pa !== pb) return pa ? 1 : -1;
        return pa ? db2 - da : da - db2;
      });

      sorted.forEach((item, i) => {
        const n = daysUntil(item);
        app.append(h("div", { class: "card", style: delay(i), onclick: () => editDate(item) },

        });
      });

    function editDate(item) {
      openForm({
        title: "Изменить дату", fields: DATE_FIELDS, values: item,
        onSave: v => { Object.assign(item, { title: v.title, date: v.date, repeat: v.repeat, note: v.note }); save(); },
        onDelete: () => { state.dates = state.dates.filter(x => x.id !== item.id); save(); }
      });

    // =====================================================================
    //   ФОТО-БЛОК (для поездок и желаний)
    // =====================================================================
    function photoBlock(owner, app, title) {
      app.append(h("div", { class: "section-title" }, "Фотографии"));

      const fileInput = h("input", { type: "file", accept: "image/*", multiple: "multiple", style: "display:none" });
      const gallery = h("div", { class: "gallery" });

      fileInput.onchange = async () => {
        const files = Array.from(fileInput.files || []);
        fileInput.value = "";
        if (!files.length) return;
        const t = toast("Загружаю фото…");
        let added = 0;
        for (const f of files) {
          try { await photoApi.add(owner.id, f); added++; } catch (e) {}
        }
        t.remove();
        if (added) photoApi.notify(added, title);
        if (added < files.length) toast("Не все фото удалось добавить", 2500);
        else toast("Добавлено: " + added, 1500);
        haptic("medium");
        fillGallery();
      };

      app.append(h("div", { class: "row" }, h("button", { class: "btn", onclick: () => fileInput.click() }, "Добавить фото"), fileInput));
      app.append(gallery);

      async function fillGallery() {
        let list = [];
        try { list = await photoApi.list(owner.id); } catch (e) {}
        list.sort((a, b) => a.ts - b.ts);
        if ((owner.photoCount || 0) !== list.length) { owner.photoCount = list.length; persist(); }
        photoUrls.forEach(u => URL.revokeObjectURL(u)); photoUrls = [];
        gallery.innerHTML = "";
        if (!list.length) {
          gallery.style.display = "block";
          gallery.append(h("div", { class: "empty", style: "padding:18px" }, "Фотографий пока нет"));
          return;
        }
        gallery.style.display = "";
        list.forEach((p, idx) => {
          const img = h("img", { alt: "" });
          photoApi.url(p.id, "thumb").then(u => { photoUrls.push(u); img.src = u; }).catch(() => {});

    function openViewer(list, startIdx, owner, onChange) {
      let idx = startIdx;
      let currentUrl = null;
      let armed = false;
      let token = 0;
      const img = h("img", { alt: "" });
      const counter = h("div", { class: "counter" });
      const stage = h("div", { class: "stage" }, img);
      const prev = h("button", { class: "btn ghost" }, "‹");
      const next = h("button", { class: "btn ghost" }, "›");
      const del = h("button", { class: "btn danger", style: "flex:2" }, "Удалить");
      const closeBtn = h("button", { class: "btn ghost", style: "flex:2" }, "Закрыть");
      const viewer = h("div", { class: "viewer" }, counter, stage, h("div", { class: "bar" }, prev, closeBtn, del, next));

      function show() {
        const my = ++token;
        counter.textContent = (idx + 1) + " / " + list.length;
        del.textContent = "Удалить";
        armed = false;
        photoApi.url(list[idx].id, "full").then(u => {
          if (my !== token) { URL.revokeObjectURL(u); return; }
          if (currentUrl) URL.revokeObjectURL(currentUrl);
          currentUrl = u;
          img.src = u;
        }).catch(() => {});
      }
      const closeViewer = () => { token++; if (currentUrl) URL.revokeObjectURL(currentUrl); viewer.remove(); };

      prev.onclick = () => { idx = (idx - 1 + list.length) % list.length; show(); };
      next.onclick = () => { idx = (idx + 1) % list.length; show(); };
      closeBtn.onclick = closeViewer;
      del.onclick = async () => {
        if (!armed) { armed = true; del.textContent = "Точно?"; return; }
        try { await photoApi.remove(list[idx].id); } catch (e) { toast("Не удалось удалить", 2000); return; }
        list.splice(idx, 1);
        owner.photoCount = list.length; persist();
        onChange();
        if (!list.length) { closeViewer(); return; }
        if (idx >= list.length) idx = list.length - 1;
        show();
      };

      let x0 = null;
      stage.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener("touchend", e => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (dx > 50) prev.onclick(); else if (dx < -50) next.onclick();
      });

      document.body.append(viewer);
      show();
    }

    function hashPin(p) {
      let x = 5381; const s = "isa-makosh:" + p;
      for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) >>> 0;

    function pinPad(app, title, sub, onComplete) {
      let val = "";
      const dots = h("div", { class: "pin-dots" }, [0, 1, 2, 3].map(() => h("span", {})));
      const upd = () => dots.querySelectorAll("span").forEach((s, i) => s.classList.toggle("on", i < val.length));
      function press(d) {
        if (val.length >= 4) return;
        val += d; haptic(); upd();
        if (val.length === 4) {
          const v = val;
          setTimeout(() => {
            const ok = onComplete(v);
            if (ok === false) {
              val = ""; upd();
              dots.classList.add("shake"); haptic("heavy");
              setTimeout(() => dots.classList.remove("shake"), 450);
            }
          }, 140);
        }
      }
      const keypad = h("div", { class: "keypad" });
      ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].forEach(k => {
        if (k === "") { keypad.append(h("button", { class: "key empty" }, "")); return; }
        keypad.append(h("button", { class: "key", onclick: () => {
          if (k === "⌫") { val = val.slice(0, -1); upd(); haptic(); } else press(k);
        } }, k));
      });
      app.append(h("div", { class: "pin-wrap" },
        h("div", { class: "lock" }, ic("lock")),
        h("h2", { class: "page-title", style: "margin-top:10px" }, title),
        h("div", { class: "sub", style: "margin-bottom:0" }, sub),
        dots, keypad));
    }

    const GIFT_FIELDS = [
      { key: "text", label: "Что хочется", placeholder: "Например: Тёплый плед", required: true },
      { key: "for", label: "Для кого", type: "select", options: [["her", "Для " + HER], ["isa", "Для Исы"]] },
      { key: "note", label: "Заметка или ссылка", type: "textarea", placeholder: "Размер, цвет, где купить" }
    ];

    function renderGifts(app) {
      const pin = (() => { try { return localStorage.getItem(PIN_KEY); } catch (e) { return null; } })();

      if (!pin) {
        const step2 = pinDraft !== null;
        pinPad(app, step2 ? "Повтори PIN-код" : "Придумай PIN-код", step2 ? "Введи те же 4 цифры ещё раз" : "4 цифры, которые закроют этот раздел", v => {
          if (!step2) { pinDraft = v; render(); return true; }
          if (v === pinDraft) {
            try { localStorage.setItem(PIN_KEY, hashPin(v)); } catch (e) {}
            pinDraft = null; giftsUnlocked = true; haptic("medium"); render(); return true;
          }
          pinDraft = null; toast("PIN-коды не совпали, попробуй заново", 2200); render(); return true;
        });
        return;
      }

      if (!giftsUnlocked) {
        pinPad(app, "Введи PIN-код", "Раздел «Идеи подарков» закрыт", v => {
          if (hashPin(v) === pin) { giftsUnlocked = true; haptic("medium"); render(); return true; }
          return false;
        });
        let armed = false;
        const forgot = h("button", { class: "linkbtn", style: "margin-top:24px" }, "Забыл PIN-код");
        forgot.onclick = () => {
          if (!armed) { armed = true; forgot.textContent = "Сброс удалит все идеи подарков. Нажми ещё раз"; return; }
          try { localStorage.removeItem(PIN_KEY); } catch (e) {}
          state.gifts = []; save(); render();
        };
        app.append(forgot);
        return;
      }

      app.append(h("h2", { class: "page-title" }, SECTIONS.gifts.title));
      app.append(h("div", { class: "sub" }, "Записывай, что хочется получить или подарить"));

      const chips = h("div", { class: "chips" });
      [["all", "Все"], ["her", "Для " + HER], ["isa", "Для Исы"]].forEach(([val, name]) => {
        chips.append(h("button", { class: "chip" + (giftFilter === val ? " active" : ""), onclick: () => { giftFilter = val; render(); } }, name));
      });
      app.append(chips);

      const list = state.gifts.filter(g => giftFilter === "all" || g.for === giftFilter);
      if (!list.length) app.append(h("div", { class: "empty" }, "Пока пусто"));

      list.forEach((g, i) => {
        app.append(h("div", { class: "card", style: delay(Math.min(i, 8)), onclick: () => {
          openForm({
            title: "Изменить идею", fields: GIFT_FIELDS, values: g,
            onSave: v => { Object.assign(g, { text: v.text, for: v.for, note: v.note }); save(); },
            onDelete: () => { state.gifts = state.gifts.filter(x => x.id !== g.id); save(); }
          });
        } },
          iconBox("gift", "sm"),
          h("div", { class: "body" },
            h("div", { class: "name" }, g.text),
            h("div", { class: "meta" }, "Для " + (g.for === "isa" ? "Исы" : HER)),
            g.note ? h("div", { class: "note" }, g.note) : null),
          h("div", { class: "arrow" }, ic("pencil"))));
      });

      addFab("Добавить идею", () => {
        openForm({
          title: "Новая идея", fields: GIFT_FIELDS,
          onSave: v => { state.gifts.push({ id: uid(), text: v.text, for: v.for, note: v.note }); save(); }
        });
      });
    }

    // =====================================================================
    //   СТАРТ
    // =====================================================================
    applyBackground();
    render();
    startSync();
    try { if (!localStorage.getItem("welcomed_v1")) showWelcome(); } catch (e) { showWelcome(); }
  </script>
</body>
</html>
