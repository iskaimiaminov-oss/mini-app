<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Для нас</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg1: #1a0f2e; --bg2: #3b1747; --bg3: #5a1f4a;
      --text: #fdf4f7; --hint: rgba(253, 244, 247, .62);
      --glass: rgba(255, 255, 255, .08); --glass-strong: rgba(255, 255, 255, .14);
      --line: rgba(255, 255, 255, .14);
      --accent1: #ff9eb5; --accent2: #f7c98b;
      --red: #ff5c6c; --yellow: #ffc94d; --green: #5fd68a;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      --sans: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg1); }
    body {
      margin: 0; padding: 22px 16px 110px; min-height: 100vh;
      font-family: var(--sans); color: var(--text);
      background:
        radial-gradient(520px 420px at 105% -5%, rgba(255, 158, 181, .35), transparent 60%),
        radial-gradient(480px 460px at -10% 45%, rgba(247, 201, 139, .20), transparent 60%),
        radial-gradient(520px 520px at 110% 100%, rgba(140, 90, 255, .30), transparent 60%),
        linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      background-attachment: fixed;
    }
    #app { position: relative; z-index: 1; animation: fade .35s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Летающие сердечки на фоне */
    .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .floaters span {
      position: absolute; bottom: -40px; color: rgba(255, 158, 181, .28);
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-115vh) rotate(40deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .floaters { display: none; } }

    h1, h2 { font-family: var(--serif); font-weight: 700; margin: 0; }
    .hero { text-align: center; padding: 10px 6px 16px; }
    .hero .orn { color: var(--accent2); letter-spacing: 8px; font-size: 14px; opacity: .9; cursor: pointer; display: inline-block; }
    .hero h1 {
      font-style: italic; font-size: 24px; line-height: 1.35; margin: 12px 0 0;
      background: linear-gradient(90deg, #ffd9e2, #ffb3c6 45%, #f7c98b);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .page-title { font-size: 26px; font-style: italic; margin: 4px 0 6px; }
    .sub { color: var(--hint); font-size: 14px; margin-bottom: 18px; line-height: 1.4; }

    /* Счётчик */
    .together {
      text-align: center; padding: 22px 16px 20px; margin-bottom: 18px; border-radius: 26px;
      background: linear-gradient(145deg, rgba(255, 158, 181, .22), rgba(247, 201, 139, .12));
      border: 1px solid rgba(255, 255, 255, .22);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, .25);
    }
    .together .lbl { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--hint); font-weight: 600; }
    .together .num {
      font: italic 700 64px/1.05 var(--serif); margin: 6px 0 2px;
      background: linear-gradient(90deg, #ffd9e2, #ff9eb5 50%, #f7c98b);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .together .days { font-size: 16px; font-weight: 600; }
    .together .ymd { color: var(--hint); font-size: 14px; margin-top: 6px; }
    .together .next { margin-top: 12px; font-size: 13px; color: var(--accent2); font-weight: 600; }
    .beat { display: inline-block; animation: beat 1.4s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } }

    /* Карточки */
    .card {
      display: flex; align-items: center; gap: 14px;
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border-radius: 20px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
      transition: transform .15s ease, background .15s ease, opacity .2s;
      animation: rise .45s ease both;
    }
    .card:active { transform: scale(.98); background: var(--glass-strong); }
    .card.used { opacity: .5; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .tile {
      width: 52px; height: 52px; border-radius: 16px; flex: none;
      display: grid; place-items: center; font-size: 26px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .35);
    }
    .tile.sm { width: 42px; height: 42px; font-size: 21px; border-radius: 13px; }
    .card .body { flex: 1; min-width: 0; }
    .card .name { font-weight: 700; font-size: 16px; line-height: 1.3; word-break: break-word; }
    .card .meta { color: var(--hint); font-size: 13px; margin-top: 3px; }
    .card .arrow { color: var(--hint); font-size: 22px; }
    .note { color: var(--hint); font-size: 14px; margin-top: 6px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
    .empty { color: var(--hint); text-align: center; padding: 34px 10px; line-height: 1.5; }
    .empty .big { font-size: 34px; display: block; margin-bottom: 6px; }

    /* Кнопки */
    .fab {
      position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
      padding: 16px; font: 700 16px var(--sans); border: 0; border-radius: 18px;
      color: #3a1030; background: linear-gradient(135deg, var(--accent2), var(--accent1));
      box-shadow: 0 10px 28px rgba(255, 158, 181, .38); z-index: 5;
    }
    .fab:active { transform: scale(.98); }
    .btn {
      padding: 13px 16px; font: 700 15px var(--sans); border: 0; border-radius: 14px;
      color: #3a1030; background: linear-gradient(135deg, var(--accent2), var(--accent1));
    }
    .btn.ghost { background: var(--glass-strong); color: var(--text); border: 1px solid var(--line); }
    .btn.danger { background: linear-gradient(135deg, #ff7a85, #e0364a); color: #fff; }
    .btn.small { padding: 9px 13px; font-size: 13px; border-radius: 12px; white-space: nowrap; }
    .row { display: flex; gap: 10px; margin-bottom: 8px; }
    .row .btn { flex: 1; }
    .section-title {
      font-family: var(--serif); font-style: italic; font-size: 19px; margin: 24px 0 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent2), var(--accent1)); color: #3a1030; margin-top: 6px;
    }
    .linkbtn { background: none; border: 0; color: var(--hint); font: 600 13px var(--sans); text-decoration: underline; padding: 10px; width: 100%; }

    /* Цветовые метки */
    .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
    .dot.red { background: var(--red); box-shadow: 0 0 12px var(--red); }
    .dot.yellow { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
    .dot.green { background: var(--green); box-shadow: 0 0 12px var(--green); }
    .legend {
      display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--hint);
      background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 16px;
    }
    .legend div { display: flex; align-items: center; gap: 10px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; padding: 9px 15px; border-radius: 20px; border: 1px solid var(--line);
      background: var(--glass); color: var(--text); font: 600 14px var(--sans);
    }
    .chip.active { background: linear-gradient(135deg, var(--accent2), var(--accent1)); color: #3a1030; border-color: transparent; }

    /* Чекбокс */
    .check {
      width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
      border: 2px solid var(--accent1); color: #3a1030; font-weight: 800; font-size: 16px; background: transparent;
    }
    .check.on { background: linear-gradient(135deg, var(--accent2), var(--accent1)); border-color: transparent; }
    .strike { text-decoration: line-through; opacity: .6; }

    /* Причины */
    .reason-stage { text-align: center; padding: 10px 0 6px; }
    .reason-heart {
      width: 150px; height: 150px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3);
      font-size: 70px; line-height: 1; cursor: pointer; color: #fff;
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .35), rgba(255, 158, 181, .35) 60%, rgba(255, 92, 140, .45));
      box-shadow: 0 14px 40px rgba(255, 92, 140, .4); animation: beat 1.6s ease-in-out infinite;
    }
    .reason-heart:active { transform: scale(.94); }
    .reason-card {
      margin: 22px 0 8px; padding: 22px 18px; border-radius: 22px; min-height: 130px;
      background: var(--glass); border: 1px solid var(--line);
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
    }
    .reason-card.pop { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes pop { from { transform: scale(.85) translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    .reason-num { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent2); font-weight: 700; min-height: 15px; }
    .reason-text { font: italic 600 21px/1.4 var(--serif); }

    /* Фото */
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .photo { aspect-ratio: 1; border-radius: 14px; overflow: hidden; cursor: pointer; background: var(--glass); border: 1px solid var(--line); }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .viewer { position: fixed; inset: 0; background: rgba(8, 3, 16, .96); z-index: 30; display: flex; flex-direction: column; animation: fade .2s ease; }
    .viewer .stage { flex: 1; display: grid; place-items: center; padding: 12px; min-height: 0; }
    .viewer img { max-width: 100%; max-height: 100%; border-radius: 12px; }
    .viewer .bar { display: flex; gap: 8px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
    .viewer .bar .btn { flex: 1; }
    .counter { text-align: center; color: var(--hint); font-size: 13px; padding-top: 14px; }

    /* Окно формы */
    .overlay {
      position: fixed; inset: 0; background: rgba(8, 3, 16, .6); z-index: 20;
      display: flex; align-items: flex-end; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    }
    .sheet {
      width: 100%; max-height: 92vh; overflow-y: auto;
      background: linear-gradient(180deg, #2b1640, #20102f);
      border: 1px solid var(--line); border-bottom: 0;
      border-radius: 26px 26px 0 0; padding: 22px 18px calc(24px + env(safe-area-inset-bottom));
      animation: slide .3s ease;
    }
    @keyframes slide { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet h3 { margin: 0 0 6px; font: italic 700 22px var(--serif); }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--hint); margin: 14px 0 6px; }
    input, textarea, select {
      width: 100%; padding: 13px 14px; font: 500 16px var(--sans); border-radius: 14px;
      border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--text);
      color-scheme: dark; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent1); }
    input::placeholder, textarea::placeholder { color: rgba(253, 244, 247, .35); }
    select option { background: #2b1640; color: #fff; }
    textarea { min-height: 96px; resize: vertical; }
    .levels { display: flex; gap: 8px; }
    .level {
      flex: 1; padding: 12px 6px; border-radius: 14px; border: 2px solid transparent;
      background: rgba(255, 255, 255, .07); color: var(--text); font: 600 13px var(--sans); text-align: center;
    }
    .level.sel.red { border-color: var(--red); background: rgba(255, 92, 108, .14); }
    .level.sel.yellow { border-color: var(--yellow); background: rgba(255, 201, 77, .14); }
    .level.sel.green { border-color: var(--green); background: rgba(95, 214, 138, .14); }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    .actions .btn { flex: 1; }
    .toast {
      position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 60; max-width: 90%; text-align: center;
      background: rgba(255, 255, 255, .95); color: #3a1030; padding: 10px 18px;
      border-radius: 20px; font: 700 14px var(--sans); box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }

    /* PIN */
    .pin-wrap { text-align: center; padding-top: 10px; }
    .pin-wrap .lock { font-size: 44px; }
    .pin-dots { display: flex; justify-content: center; gap: 16px; margin: 18px 0 26px; }
    .pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent1); }
    .pin-dots span.on { background: var(--accent1); box-shadow: 0 0 12px var(--accent1); }
    .pin-dots.shake { animation: shake .4s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 0 auto; }
    .key {
      height: 64px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass);
      color: var(--text); font: 600 24px var(--sans);
    }
    .key:active { background: var(--glass-strong); transform: scale(.94); }
    .key.empty { visibility: hidden; }

    /* Праздничные сердечки и приветствие */
    .burst { position: fixed; bottom: 25%; z-index: 45; pointer-events: none; animation: burstUp 1.9s ease-out forwards; }
    @keyframes burstUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-48vh) scale(1.2) rotate(25deg); opacity: 0; } }
    .welcome {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 30px;
      background:
        radial-gradient(520px 420px at 105% -5%, rgba(255, 158, 181, .4), transparent 60%),
        radial-gradient(520px 520px at -10% 105%, rgba(140, 90, 255, .35), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      animation: fade .6s ease;
    }
    .welcome .heart { font-size: 84px; animation: beat 1.4s ease-in-out infinite; }
    .welcome h1 {
      font-style: italic; font-size: 34px; margin: 18px 0 10px; opacity: 0; animation: rise .9s .5s ease forwards;
      background: linear-gradient(90deg, #ffd9e2, #ffb3c6 45%, #f7c98b);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .welcome p { font: italic 500 20px/1.5 var(--serif); margin: 0 0 34px; opacity: 0; animation: rise .9s 1.1s ease forwards; max-width: 320px; }
    .welcome .btn { padding: 16px 34px; font-size: 16px; border-radius: 18px; opacity: 0; animation: rise .9s 1.7s ease forwards; box-shadow: 0 10px 28px rgba(255, 158, 181, .38); }
  </style>
</head>

    // Письма, которые будут лежать в приложении с самого начала (можно писать и в самом приложении).
    // Пример: { id: "seed_l1", title: "Открой в годовщину", from: "Иса", openDate: "2026-08-13", text: "Текст письма" }
    const SEED_LETTERS = [];

    // =====================================================================
    //   ДАННЫЕ
    // =====================================================================
    const KEY = "isa_makosh_v1";

    function defaultState() {
      const trips = [];
      for (let i = 1; i <= 10; i++) {
        trips.push({ id: "t" + i, title: "Поездка " + i, place: "", when: "", notes: "", memories: [], photoCount: 0 });
      }
      return {
        dates: [], trips: trips, prefs: { our: [], isa: [], makosh: [] },
        letters: [], wishes: [], gifts: [], reasons: [], coupons: [], songs: [],
        couponUsed: {}, seeded: []
      };
    }

    function load() {
      const d = defaultState();
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const s = JSON.parse(raw);
          const st = Object.assign({}, d, s);
          st.prefs = Object.assign(d.prefs, s.prefs || {});
          ["dates", "trips", "letters", "wishes", "gifts", "reasons", "coupons", "songs", "seeded"].forEach(k => {
            if (!Array.isArray(st[k])) st[k] = d[k];
          });
          if (!st.couponUsed || typeof st.couponUsed !== "object") st.couponUsed = {};
          st.trips.forEach(t => { if (typeof t.photoCount !== "number") t.photoCount = 0; if (!t.memories) t.memories = []; });
          return st;
        }
      } catch (e) {}
      return d;
    }

    let state = load();
    let pushTimer = null;
    function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
    function save() {
      persist();
      if (SYNC_ON && localStorage.getItem(INIT_KEY)) { clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 400); }
    }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    // known: id записей, которые уже есть на сервере (чтобы не создавать дубли)
    function applySeeds(known) {
      let changed = false;
      const tryAdd = (s, list) => {
        if (state.seeded.includes(s.id)) return;
        state.seeded.push(s.id); changed = true;
        if ((known && known.has(s.id)) || list.some(x => x.id === s.id)) return;
        list.push(Object.assign({}, s));
      };
      SEED_DATES.forEach(s => tryAdd(s, state.dates));
      SEED_LETTERS.forEach(s => tryAdd(s, state.letters));
      if (changed) save();
    }

    // =====================================================================
    //   СИНХРОНИЗАЦИЯ С СЕРВЕРОМ
    // =====================================================================
    const SNAP_KEY = "sync_snap_v1", SINCE_KEY = "sync_since_v1", INIT_KEY = "sync_init_v1";
    let lastKnownIds = null;
    let lastSyncError = "";

    // Одинаковая строка для одинаковых данных (порядок ключей не важен)
    function stable(v) {
      if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
      if (v && typeof v === "object") {
        return "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
      }
      return JSON.stringify(v);
    }

    function getSnap() { try { return JSON.parse(localStorage.getItem(SNAP_KEY) || "{}"); } catch (e) { return {}; } }
    function setSnap(s) { try { localStorage.setItem(SNAP_KEY, JSON.stringify(s)); } catch (e) {} }

    async function apiFetch(path, opts) {
      opts = opts || {};
      const headers = Object.assign({ "X-Init-Data": tg.initData }, opts.headers || {});
      const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers: headers }));
      if (!res.ok) throw new Error(String(res.status));
      return res;
    }

    // Превращаем все данные в плоский список записей: ключ "раздел:id"
    function flatten() {
      const f = {};
      const put = (col, o) => {
        const d = Object.assign({}, o);
        delete d.photoCount;
        if (col === "trips") delete d.memories;
        f[col + ":" + o.id] = { col: col, id: o.id, data: d };
      };
      state.dates.forEach(o => put("dates", o));
      state.trips.forEach(t => {
        put("trips", t);
        (t.memories || []).forEach(m => {
          f["memories:" + m.id] = { col: "memories", id: m.id, data: { id: m.id, tripId: t.id, text: m.text } };
        });
      });
      ["our", "isa", "makosh"].forEach(k => (state.prefs[k] || []).forEach(o => put("prefs_" + k, o)));
      state.reasons.forEach(o => put("reasons", o));
      state.coupons.forEach(o => put("coupons", o));
      state.songs.forEach(o => put("songs", o));
      state.letters.forEach(o => put("letters", o));
      state.wishes.forEach(o => put("wishes", o));
      Object.keys(state.couponUsed).forEach(cid => {
        f["couponUsed:cu_" + cid] = { col: "couponUsed", id: "cu_" + cid, data: { cid: cid, on: state.couponUsed[cid] } };
      });
      return f;
    }

    function listFor(col) {
      if (col.indexOf("prefs_") === 0) return state.prefs[col.slice(6)] || null;
      return { dates: state.dates, trips: state.trips, reasons: state.reasons, coupons: state.coupons,
               songs: state.songs, letters: state.letters, wishes: state.wishes }[col] || null;
    }

    // Применяем запись, пришедшую с сервера
    function applyRemote(it) {
      const d = it.data || {};
      if (it.col === "couponUsed") {
        if (it.deleted) delete state.couponUsed[d.cid]; else state.couponUsed[d.cid] = d.on;
        return;
      }
      if (it.col === "memories") {
        const trip = state.trips.find(t => t.id === d.tripId);
        if (!trip) return;
        const i = trip.memories.findIndex(m => m.id === it.id);
        if (it.deleted) { if (i >= 0) trip.memories.splice(i, 1); }
        else if (i >= 0) trip.memories[i] = { id: it.id, text: d.text };
        else trip.memories.push({ id: it.id, text: d.text });
        return;
      }
      const list = listFor(it.col);
      if (!list) return;
      const i = list.findIndex(x => x.id === it.id);
      if (it.deleted) { if (i >= 0) list.splice(i, 1); return; }
      const obj = Object.assign({}, d);
      if (it.col === "trips") obj.memories = i >= 0 ? list[i].memories : [];
      if (it.col === "trips" || it.col === "wishes") obj.photoCount = (i >= 0 && list[i].photoCount) || 0;
      if (i >= 0) list[i] = obj; else list.push(obj);
    }

    function labelFor(rec) {
      const d = rec.data || {};
      switch (rec.col) {
        case "dates": case "trips": case "coupons": case "songs": return d.title || "";
        case "wishes": return d.text || "";
        case "memories": { const t = state.trips.find(x => x.id === d.tripId); return t ? t.title : ""; }
        case "couponUsed": { const c = COUPONS.concat(state.coupons).find(x => x.id === d.cid); return c ? c.title : ""; }
        default: return String(d.text || d.title || "").slice(0, 80);
      }
    }

    async function pull(initial) {
      const since = initial ? 0 : Number(localStorage.getItem(SINCE_KEY) || 0);
      const res = await (await apiFetch("/api/sync?since=" + since)).json();
      const snap = getSnap();
      const flat = flatten();
      const known = new Set();
      let changed = false;
      // сначала всё, кроме воспоминаний, чтобы поездки уже существовали
      const items = res.items.filter(i => i.col !== "memories").concat(res.items.filter(i => i.col === "memories"));
      items.forEach(it => {
        known.add(it.id);
        const key = it.col + ":" + it.id;
        const mine = flat[key];
        // есть мои неотправленные правки: не затираем их
        const pending = !initial && mine && snap[key] !== stable(mine.data);
        if (pending) return;
        if (it.deleted) {
          if (mine) changed = true;
          applyRemote(it);
          delete snap[key];
          return;
        }
        const s = stable(it.data);
        if (snap[key] === s && !initial) return;
        applyRemote(it);
        snap[key] = s;
        changed = true;
      });
      setSnap(snap);
      try { localStorage.setItem(SINCE_KEY, String(Math.max(0, res.now - 2000))); } catch (e) {}
      lastKnownIds = known;
      if (changed) { persist(); afterRemoteChange(); }
    }

    function afterRemoteChange() {
      const cur = stack[stack.length - 1];
      if (cur.name !== "gifts") render();
    }

    async function pushDiff(silent) {
      const flat = flatten(), snap = getSnap();
      const ops = [];
      Object.keys(flat).forEach(key => {
        const rec = flat[key];
        if (snap[key] !== stable(rec.data)) ops.push({ op: "put", col: rec.col, id: rec.id, data: rec.data, label: labelFor(rec) });
      });
      Object.keys(snap).forEach(key => {
        if (!(key in flat)) { const i = key.indexOf(":"); ops.push({ op: "del", col: key.slice(0, i), id: key.slice(i + 1) }); }
      });
      for (let i = 0; i < ops.length; i += 25) {
        const chunk = ops.slice(i, i + 25);
        await apiFetch("/api/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ops: chunk, silent: !!silent })
        });
        const sn = getSnap();
        chunk.forEach(o => {
          const key = o.col + ":" + o.id;
          if (o.op === "put") sn[key] = stable(o.data); else delete sn[key];
        });
        setSnap(sn);
      }
    }

    async function uploadPhoto(ownerId, id, full, thumb, ts) {
      await apiFetch("/api/photo?owner=" + encodeURIComponent(ownerId) + "&id=" + encodeURIComponent(id) +
        "&ts=" + ts + "&tl=" + thumb.size, {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream" },
        body: new Blob([thumb, full])
      });
    }

    // Фото, добавленные раньше на этом устройстве, переносим на сервер
    async function migrateLocalPhotos() {
      if (localStorage.getItem("photos_migrated_v1")) return;
      let all = [];
      try { all = await tx("readonly", s => s.getAll()); } catch (e) { all = []; }
      for (const p of all) {
        try {
          const thumb = await resizeImage(p.blob, 360, 0.75);
          await uploadPhoto(p.tripId, p.id, p.blob, thumb, p.ts || Date.now());
          await delPhoto(p.id);
        } catch (e) { return; }
      }
      try { localStorage.setItem("photos_migrated_v1", "1"); } catch (e) {}
    }

    async function initialSync() {
      await pull(true);
      applySeeds(lastKnownIds);
      await migrateLocalPhotos();
      await pushDiff(true);
      localStorage.setItem(INIT_KEY, "1");
      afterRemoteChange();
    }

    let syncing = false, again = false;
    async function syncNow() {
      if (!SYNC_ON) return;
      if (syncing) { again = true; return; }
      syncing = true;
      setSyncUI("busy");
      try {
        if (!localStorage.getItem(INIT_KEY)) await initialSync();
        else { await pull(false); await pushDiff(false); }
        lastSyncError = "";
        setSyncUI("ok");
      } catch (e) {
        const code = String(e && e.message || "");
        lastSyncError = code;
        setSyncUI(code === "401" || code === "403" ? "denied" : "err");
      } finally {
        syncing = false;
        if (again) { again = false; setTimeout(syncNow, 300); }
      }
    }

    function setSyncUI(kind) {
      const el = document.getElementById("syncdot");
      if (!el) return;
      const map = {
        ok: ["#5fd68a", "синхронизировано"], busy: ["#ffc94d", "синхронизация…"],
        err: ["#ff5c6c", "нет связи"], denied: ["#ff5c6c", "нет доступа"]
      };
      const m = map[kind];
      el.innerHTML = "";
      el.append(h("span", { class: "sd", style: "background:" + m[0] }), m[1]);
      el.dataset.kind = kind;
    }

    function startSync() {
      const el = document.getElementById("syncdot");
      if (el) el.onclick = () => {
        const k = el.dataset.kind;
        if (k === "denied") toast("Нет доступа: проверь Telegram ID в настройках сервера или открой приложение заново", 4000);
        else if (k === "err") toast("Нет связи с сервером" + (lastSyncError ? " (" + lastSyncError + ")" : ""), 3000);
        else toast("Всё синхронизировано ✨", 1500);
        syncNow();
      };
      syncNow();
      setInterval(() => { if (!document.hidden) syncNow(); }, 12000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
    }

    // Работа с фото: на сервере (если подключён) или на устройстве
    const photoApi = {
      async list(ownerId) {
        if (REMOTE) { const r = await apiFetch("/api/photos?owner=" + encodeURIComponent(ownerId)); return (await r.json()).photos || []; }
        const l = await getPhotos(ownerId);
        return l.map(p => ({ id: p.id, ts: p.ts }));
      },
      async url(id, size) {
        if (!REMOTE) {
          const rec = await tx("readonly", s => s.get(id));
          return URL.createObjectURL(rec.blob);
        }
        const path = "/api/photo/" + encodeURIComponent(id) + "?size=" + size;
        const key = API_BASE + path;
        let resp = null, cache = null;
        try { cache = await caches.open("isa-photos-v1"); resp = await cache.match(key); } catch (e) {}
        if (!resp) {
          resp = await apiFetch(path);
          if (cache) { try { await cache.put(key, resp.clone()); } catch (e) {} }
        }
        return URL.createObjectURL(await resp.blob());
      },
      async add(ownerId, file) {
        if (!REMOTE) {
          const blob = await resizeImage(file, 1280);
          await putPhoto({ id: uid(), tripId: ownerId, blob: blob, ts: Date.now() });
          return;
        }
        const full = await resizeImage(file, 1280, 0.82);
        const thumb = await resizeImage(file, 360, 0.75);
        await uploadPhoto(ownerId, uid(), full, thumb, Date.now());
      },
      async remove(id) {
        if (REMOTE) await apiFetch("/api/photo/" + encodeURIComponent(id), { method: "DELETE" });
        else await delPhoto(id);
      },
      notify(count, label) {
        apiFetch("/api/notify", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: "photos", count: count, label: label })
        }).catch(() => {});
      }
    };

    // =====================================================================
    //   ФОТО (IndexedDB)
    // =====================================================================
    let dbPromise;
    function db() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const r = indexedDB.open("isa_makosh_photos", 1);
          r.onupgradeneeded = () => {
            const s = r.result.createObjectStore("photos", { keyPath: "id" });
            s.createIndex("tripId", "tripId");
          };
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => reject(r.error);
        });
      }
      return dbPromise;
    }
    function tx(mode, fn) {
      return db().then(d => new Promise((resolve, reject) => {
        const t = d.transaction("photos", mode);
        const req = fn(t.objectStore("photos"));
        t.oncomplete = () => resolve(req ? req.result : undefined);
        t.onerror = () => reject(t.error);
      }));
    }
    const putPhoto = rec => tx("readwrite", s => s.put(rec));
    const getPhotos = ownerId => tx("readonly", s => s.index("tripId").getAll(ownerId));
    const delPhoto = id => tx("readwrite", s => s.delete(id));

    async function deleteOwnerPhotos(ownerId) {
      try { const list = await getPhotos(ownerId); for (const p of list) await delPhoto(p.id); } catch (e) {}
    }

    function resizeImage(file, max) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(b => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error("blob")); }, "image/jpeg", 0.82);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
        img.src = url;
      });
    }

    // =====================================================================
    //   ПОМОЩНИКИ
    // =====================================================================
    function h(tag, attrs, ...children) {
      const e = document.createElement(tag);
      for (const k in (attrs || {})) {
        if (k === "class") e.className = attrs[k];
        else if (k.startsWith("on")) e[k] = attrs[k];
        else e.setAttribute(k, attrs[k]);
      }
      children.flat().forEach(c => {
        if (c == null || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(c));
      });
      return e;
    }

    function haptic(type) { try { tg.HapticFeedback.impactOccurred(type || "light"); } catch (e) {} }
    function openLink(url) { try { tg.openLink(url); } catch (e) { window.open(url, "_blank"); } }

    function toast(text, ms) {
      const t = h("div", { class: "toast" }, text);
      document.body.append(t);
      if (ms) setTimeout(() => t.remove(), ms);
      return t;
    }

    function pad(n) { return String(n).padStart(2, "0"); }
    function todayISO() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
    function todayMid() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }

    function formatDate(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return d + "." + m + "." + y;
    }

    function plural(n, forms) {
      const a = Math.abs(n) % 100, b = a % 10;
      if (a > 10 && a < 20) return forms[2];
      if (b > 1 && b < 5) return forms[1];
      if (b === 1) return forms[0];
      return forms[2];
    }

    function daysUntil(item) {
      if (!item.date) return null;
      const [y, m, d] = item.date.split("-").map(Number);
      const today = todayMid();
      let target = new Date(y, m - 1, d);
      if (item.repeat === "yearly") {
        target = new Date(today.getFullYear(), m - 1, d);
        if (target < today) target = new Date(today.getFullYear() + 1, m - 1, d);
      }
      return Math.round((target - today) / 86400000);
    }

    function daysLabel(n) {
      if (n === null) return "";
      if (n === 0) return "Сегодня! 🎉";
      if (n === 1) return "Завтра";
      if (n > 1) return "Через " + n + " " + plural(n, ["день", "дня", "дней"]);
      return "Прошло " + Math.abs(n) + " " + plural(n, ["день", "дня", "дней"]) + " назад";
    }

    function diffYMD(a, b) {
      let y = b.getFullYear() - a.getFullYear();
      let m = b.getMonth() - a.getMonth();
      let d = b.getDate() - a.getDate();
      if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
      if (m < 0) { y--; m += 12; }
      return { y, m, d };
    }

    function celebrate(count) {
      const em = ["💖", "✨", "💗", "🎉", "💫", "🌸"];
      for (let i = 0; i < (count || 18); i++) {
        const s = h("span", { class: "burst", style: "left:" + (8 + Math.random() * 84) + "%;animation-delay:" + (Math.random() * 0.35) + "s;font-size:" + (18 + Math.random() * 20) + "px" }, em[i % em.length]);
        document.body.append(s);
        setTimeout(() => s.remove(), 2400);
      }
    }

    function floaters() {
      const wrap = h("div", { class: "floaters" });
      for (let i = 0; i < 14; i++) {
        wrap.append(h("span", {
          style: "left:" + (Math.random() * 100) + "%;font-size:" + (10 + Math.random() * 16) + "px;animation-duration:" + (16 + Math.random() * 18) + "s;animation-delay:" + (-Math.random() * 24) + "s"
        }, i % 3 === 0 ? "✦" : "♥"));
      }
      document.body.prepend(wrap);
    }

    // =====================================================================
    //   ОКНА: ФОРМА И ЧТЕНИЕ
    // =====================================================================
    function openForm(opts) {
      const values = Object.assign({}, opts.values || {});
      const inputs = {};
      const body = h("div", {});
      body.append(h("h3", {}, opts.title));

      opts.fields.forEach(f => {
        body.append(h("label", {}, f.label));
        if (f.type === "level") {
          if (!values[f.key]) values[f.key] = "red";
          const wrap = h("div", { class: "levels" });
          Object.keys(LEVELS).forEach(k => {
            const b = h("button", { type: "button", class: "level " + k },
              h("div", { class: "dot " + k, style: "margin:0 auto 8px" }),
              LEVELS[k].name,
              h("div", { style: "font-size:11px;color:var(--hint);margin-top:3px;font-weight:500" }, LEVELS[k].hint));
            b.onclick = () => {
              values[f.key] = k;
              wrap.querySelectorAll(".level").forEach(x => x.classList.remove("sel"));
              b.classList.add("sel");
              haptic();
            };
            if (values[f.key] === k) b.classList.add("sel");
            wrap.append(b);
          });
          body.append(wrap);
        } else if (f.type === "select") {
          const s = h("select", {}, f.options.map(o => h("option", { value: o[0] }, o[1])));
          s.value = values[f.key] || f.options[0][0];
          inputs[f.key] = s;
          body.append(s);
        } else if (f.type === "textarea") {
          const t = h("textarea", { placeholder: f.placeholder || "" });
          t.value = values[f.key] || "";
          inputs[f.key] = t;
          body.append(t);
        } else {
          const i = h("input", { type: f.type || "text", placeholder: f.placeholder || "" });
          i.value = values[f.key] || "";
          inputs[f.key] = i;
          body.append(i);
        }
      });

      const overlay = h("div", { class: "overlay" }, h("div", { class: "sheet" }, body));
      const close = () => overlay.remove();
      overlay.onclick = e => { if (e.target === overlay) close(); };

      const actions = h("div", { class: "actions" });
      actions.append(h("button", { class: "btn ghost", onclick: close }, "Отмена"));
      actions.append(h("button", { class: "btn", onclick: () => {
        const out = Object.assign({}, values);
        for (const k in inputs) out[k] = inputs[k].value.trim();
        const missing = opts.fields.find(f => f.required && !out[f.key]);
        if (missing) { inputs[missing.key].focus(); haptic(); return; }
        opts.onSave(out);
        haptic("medium");

      const parts = [];
      if (y > 0) parts.push(y + " " + plural(y, ["год", "года", "лет"]));
      if (m > 0) parts.push(m + " " + plural(m, ["месяц", "месяца", "месяцев"]));

      app.append(h("div", { class: "together" },

        h("div", { class: "days" }, plural(total, ["день", "дня", "дней"]), " ", h("span", { class: "beat" }, "❤️")),
        parts.length ? h("div", { class: "ymd" }, parts.join(" · ")) : null,

    function photoBlock(owner, app) {

      const fileInput = h("input", { type: "file", accept: "image/*", multiple: "multiple", style: "display:none" });

        const t = toast("Загружаю фото…");
        let added = 0;
        for (const f of files) {
          try {
            const blob = await resizeImage(f, 1280);
            await putPhoto({ id: uid(), tripId: owner.id, blob: blob, ts: Date.now() });
            owner.photoCount = (owner.photoCount || 0) + 1; added++;
          } catch (e) {}
        }
        t.remove();
        save();
        if (added < files.length) toast("Не все фото удалось добавить", 2500);
        else toast("Добавлено: " + added, 1500);
        haptic("medium");
        fillGallery();

      app.append(h("div", { class: "row" }, h("button", { class: "btn", onclick: () => fileInput.click() }, "📷 Добавить фото"), fileInput));
      app.append(gallery);

      async function fillGallery() {
        let list = [];
        try { list = await getPhotos(owner.id); } catch (e) {}
        list.sort((a, b) => a.ts - b.ts);
        if (owner.photoCount !== list.length) { owner.photoCount = list.length; save(); }
        photoUrls.forEach(u => URL.revokeObjectURL(u)); photoUrls = [];
        gallery.innerHTML = "";
        if (!list.length) {
          gallery.style.display = "block";
          gallery.append(h("div", { class: "empty", style: "padding:18px" }, "Фотографий пока нет"));
          return;
        }
        gallery.style.display = "";
        list.forEach((p, idx) => {
          const url = URL.createObjectURL(p.blob);
          photoUrls.push(url);
          gallery.append(h("div", { class: "photo", onclick: () => openViewer(list, idx, owner, fillGallery) }, h("img", { src: url, alt: "" })));
        });
      }
      fillGallery();
    }

    function openViewer(list, startIdx, owner, onChange) {
      let idx = startIdx;
      let currentUrl = null;
      let armed = false;
      const img = h("img", { alt: "" });
      const counter = h("div", { class: "counter" });
      const stage = h("div", { class: "stage" }, img);
      const prev = h("button", { class: "btn ghost" }, "‹");
      const next = h("button", { class: "btn ghost" }, "›");
      const del = h("button", { class: "btn danger", style: "flex:2" }, "Удалить");
      const closeBtn = h("button", { class: "btn ghost", style: "flex:2" }, "Закрыть");
      const viewer = h("div", { class: "viewer" }, counter, stage, h("div", { class: "bar" }, prev, closeBtn, del, next));

      function show() {
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = URL.createObjectURL(list[idx].blob);
        img.src = currentUrl;
        counter.textContent = (idx + 1) + " / " + list.length;
        del.textContent = "Удалить";
        armed = false;
      }
      const closeViewer = () => { if (currentUrl) URL.revokeObjectURL(currentUrl); viewer.remove(); };

      prev.onclick = () => { idx = (idx - 1 + list.length) % list.length; show(); };
      next.onclick = () => { idx = (idx + 1) % list.length; show(); };
      closeBtn.onclick = closeViewer;
      del.onclick = async () => {
        if (!armed) { armed = true; del.textContent = "Точно?"; return; }
        try { await delPhoto(list[idx].id); } catch (e) {}
        owner.photoCount = Math.max(0, (owner.photoCount || 1) - 1); save();
        list.splice(idx, 1);
        onChange();
        if (!list.length) { closeViewer(); return; }
        if (idx >= list.length) idx = list.length - 1;
        show();
      };

      let x0 = null;
      stage.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener("touchend", e => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (dx > 50) prev.onclick(); else if (dx < -50) next.onclick();
      });

      document.body.append(viewer);
      show();
    }

      const toggle = h("button", { class: "linkbtn", onclick: () => { showAllReasons = !showAllReasons; render(); } },
        showAllReasons ? "Скрыть список" : "Показать все причины (" + all.length + ")");
      app.append(toggle);

      if (showAllReasons) {
        all.forEach((r, i) => {
          app.append(h("div", { class: "card", style: delay(Math.min(i, 8)), onclick: () => {
            if (!r.custom) { toast("Эту причину можно изменить только в коде", 2000); return; }
            const item = state.reasons.find(x => x.id === r.id);
            openForm({
              title: "Изменить причину", fields: REASON_FIELDS, values: item,
              onSave: v => { item.text = v.text; save(); },
              onDelete: () => { state.reasons = state.reasons.filter(x => x.id !== r.id); save(); }
            });
          } },
            h("div", { class: "tile sm", style: "background:" + SECTIONS.reasons.grad }, String(i + 1)),
            h("div", { class: "body" }, h("div", { style: "font-weight:500;line-height:1.45" }, r.text)),
            r.custom ? h("div", { class: "arrow" }, "✎") : null));
        });
      }

      addFab("+ Добавить причину", () => {
        openForm({
          title: "Новая причина", fields: REASON_FIELDS,
          onSave: v => { state.reasons.push({ id: uid(), text: v.text }); save(); }
        });
      });
    }

    // =====================================================================
    //   КУПОНЫ ЛЮБВИ
    // =====================================================================
    const COUPON_FIELDS = [
      { key: "title", label: "Название купона", placeholder: "Например: Купон на завтрак в постель", required: true }
    ];

    function renderCoupons(app) {
      app.append(h("h2", { class: "page-title" }, SECTIONS.coupons.emoji + " Купоны любви"));

      const all = COUPONS.map(c => ({ id: c.id, emoji: c.emoji, title: c.title, custom: false }))
        .concat(state.coupons.map(c => ({ id: c.id, emoji: "🎟️", title: c.title, custom: true })));
      const used = all.filter(c => state.couponUsed[c.id]).length;
      app.append(h("div", { class: "sub" }, "Использовано: " + used + " из " + all.length + ". Нажми «Использовать», чтобы активировать купон"));

      const sorted = all.filter(c => !state.couponUsed[c.id]).concat(all.filter(c => state.couponUsed[c.id]));

      sorted.forEach((c, i) => {
        const usedOn = state.couponUsed[c.id];
        const btn = h("button", { class: "btn small" + (usedOn ? " ghost" : "") }, usedOn ? "Вернуть" : "Использовать");
        let armed = false, timer = null;
        btn.onclick = e => {
          e.stopPropagation();
          if (usedOn) { delete state.couponUsed[c.id]; save(); haptic(); render(); return; }
          if (!armed) {
            armed = true; btn.textContent = "Точно?"; haptic();
            timer = setTimeout(() => { armed = false; btn.textContent = "Использовать"; }, 3000);
            return;
          }
          clearTimeout(timer);
          state.couponUsed[c.id] = todayISO(); save();
          haptic("heavy"); celebrate(22); render();
        };

        app.append(h("div", { class: "card" + (usedOn ? " used" : ""), style: delay(Math.min(i, 8)), onclick: () => {
          if (!c.custom) return;
          const item = state.coupons.find(x => x.id === c.id);
          openForm({
            title: "Изменить купон", fields: COUPON_FIELDS, values: item,
            onSave: v => { item.title = v.title; save(); },
            onDelete: () => { state.coupons = state.coupons.filter(x => x.id !== c.id); delete state.couponUsed[c.id]; save(); }
          });
        } },
          h("div", { class: "tile", style: "background:" + SECTIONS.coupons.grad }, c.emoji),
          h("div", { class: "body" },
            h("div", { class: "name" }, c.title),
            h("div", { class: "meta" }, usedOn ? "Использован " + formatDate(usedOn) : "Действителен без срока")),
          btn));
      });

      addFab("+ Добавить купон", () => {
        openForm({
          title: "Новый купон", fields: COUPON_FIELDS,
          onSave: v => { state.coupons.push({ id: uid(), title: v.title }); save(); }
        });
      });
    }

    // =====================================================================
    //   ПИСЬМА В БУДУЩЕЕ
    // =====================================================================
    const LETTER_FIELDS = [
      { key: "title", label: "Заголовок", placeholder: "Например: Открой в нашу годовщину", required: true },
      { key: "from", label: "От кого", type: "select", options: [["Иса", "От Исы"], ["Макош", "От Макош"]] },
      { key: "openDate", label: "Откроется", type: "date", required: true },
      { key: "text", label: "Текст письма", type: "textarea", placeholder: "Напиши, что хочешь сказать", required: true }
    ];

    function renderLetters(app) {
      app.append(h("h2", { class: "page-title" }, SECTIONS.letters.emoji + " Письма в будущее"));
      app.append(h("div", { class: "sub" }, "Письмо закрыто до выбранной даты, а потом его можно прочитать"));

      const today = todayISO();
      const locked = state.letters.filter(l => l.openDate > today).sort((a, b) => a.openDate.localeCompare(b.openDate));
      const opened = state.letters.filter(l => l.openDate <= today).sort((a, b) => b.openDate.localeCompare(a.openDate));

      if (!state.letters.length) {
        app.append(h("div", { class: "empty" }, h("span", { class: "big" }, "💌"), "Писем пока нет.", h("br"), "Напиши первое кнопкой ниже."));
      }

      let i = 0;
      locked.forEach(l => {
        const n = daysUntil({ date: l.openDate });
        app.append(h("div", { class: "card", style: delay(Math.min(i++, 8)), onclick: () => {
          haptic(); toast("🔒 Откроется " + formatDate(l.openDate), 2200);
        } },
          h("div", { class: "tile", style: "background:linear-gradient(135deg,#5b4a78,#3a2d52)" }, "🔒"),
          h("div", { class: "body" },
            h("div", { class: "name" }, l.title),
            h("div", { class: "meta" }, "От " + (l.from === "Макош" ? "Макош" : "Исы") + " · откроется " + formatDate(l.openDate)),
            h("span", { class: "badge" }, "Через " + n + " " + plural(n, ["день", "дня", "дней"]))),
          h("button", { class: "btn small ghost", onclick: e => {
            e.stopPropagation();
            openForm({
              title: "Изменить письмо", fields: LETTER_FIELDS, values: l,
              onSave: v => { Object.assign(l, { title: v.title, from: v.from, openDate: v.openDate, text: v.text }); save(); },
              onDelete: () => { state.letters = state.letters.filter(x => x.id !== l.id); save(); }
            });
          } }, "✎")));
      });

      opened.forEach(l => {
        app.append(h("div", { class: "card", style: delay(Math.min(i++, 8)), onclick: () => {
          openReader(l.title, "От " + (l.from === "Макош" ? "Макош" : "Исы") + " · " + formatDate(l.openDate), l.text, () => {
            state.letters = state.letters.filter(x => x.id !== l.id); save();
          });
        } },
          h("div", { class: "tile", style: "background:" + SECTIONS.letters.grad }, "💌"),
          h("div", { class: "body" },
            h("div", { class: "name" }, l.title),
            h("div", { class: "meta" }, "От " + (l.from === "Макош" ? "Макош" : "Исы") + " · " + formatDate(l.openDate)),
            h("span", { class: "badge" }, "Открыто")),
          h("div", { class: "arrow" }, "›")));
      });

      addFab("+ Написать письмо", () => {
        openForm({
          title: "Новое письмо", fields: LETTER_FIELDS,
          onSave: v => { state.letters.push({ id: uid(), title: v.title, from: v.from, openDate: v.openDate, text: v.text }); save(); }
        });
      });
    }

    // =====================================================================
    //   ХОТИМ ВМЕСТЕ
    // =====================================================================
    const WISH_FIELDS = [
      { key: "text", label: "Что хотим сделать", placeholder: "Например: Съездить на море", required: true },
      { key: "note", label: "Заметка", type: "textarea", placeholder: "Детали или впечатления" }
    ];

    function renderWishes(app) {
      app.append(h("h2", { class: "page-title" }, SECTIONS.wishes.emoji + " Хотим вместе"));
      const done = state.wishes.filter(w => w.done).length;
      app.append(h("div", { class: "sub" }, "Сделано: " + done + " из " + state.wishes.length + ". Места, фильмы, свидания, идеи"));

      if (!state.wishes.length) {
        app.append(h("div", { class: "empty" }, h("span", { class: "big" }, "🌍"), "Пока пусто.", h("br"), "Запиши, что хотите сделать вместе."));
      }

      const sorted = state.wishes.filter(w => !w.done).concat(state.wishes.filter(w => w.done));
      sorted.forEach((w, i) => {
        const chk = h("button", { class: "check" + (w.done ? " on" : ""), onclick: e => {
          e.stopPropagation();
          w.done = !w.done; save();
          if (w.done) { celebrate(14); haptic("medium"); } else haptic();
          render();
        } }, w.done ? "✓" : "");
        app.append(h("div", { class: "card", style: delay(Math.min(i, 8)), onclick: () => { haptic(); go("wish", w.id); } },
          chk,
          h("div", { class: "body" },
            h("div", { class: "name" + (w.done ? " strike" : "") }, w.text),
            (w.note || w.photoCount) ? h("div", { class: "meta" }, [w.note ? "есть заметка" : "", w.photoCount ? "фото: " + w.photoCount : ""].filter(Boolean).join(" · ")) : null),
          h("div", { class: "arrow" }, "›")));
      });

      addFab("+ Добавить в список", () => {
        openForm({
          title: "Новое желание", fields: WISH_FIELDS,
          onSave: v => { state.wishes.push({ id: "w" + uid(), text: v.text, note: v.note, done: false, photoCount: 0 }); save(); }
        });
      });
    }

    function renderWish(app, id) {
      const w = state.wishes.find(x => x.id === id);
      if (!w) { back(); return; }

      app.append(h("h2", { class: "page-title" + (w.done ? " strike" : "") }, w.text));
      app.append(h("div", {}, h("span", { class: "badge" }, w.done ? "Сделано ✓" : "В планах")));
      if (w.note) app.append(h("div", { class: "note", style: "margin:12px 0 0" }, w.note));

      app.append(h("div", { class: "row", style: "margin-top:16px" },
        h("button", { class: "btn", onclick: () => {
          w.done = !w.done; save();
          if (w.done) { celebrate(16); haptic("medium"); }
          render();
        } }, w.done ? "Вернуть в планы" : "✓ Мы это сделали"),
        h("button", { class: "btn ghost", onclick: () => {
          openForm({
            title: "Изменить", fields: WISH_FIELDS, values: w,
            onSave: v => { w.text = v.text; w.note = v.note; save(); },
            onDelete: () => { state.wishes = state.wishes.filter(x => x.id !== w.id); save(); deleteOwnerPhotos(w.id); },
            afterDelete: () => { stack.pop(); }
          });
        } }, "✎ Изменить")));

      photoBlock(w, app);
    }

    // =====================================================================
    //   ИДЕИ ПОДАРКОВ (с PIN-кодом)
    // =====================================================================
    const PIN_KEY = "gifts_pin_v1";
    let pinDraft = null;
    let giftFilter = "all";

    function hashPin(p) {
      let x = 5381; const s = "isa-makosh:" + p;
      for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) >>> 0;
      return String(x);
    }

    function pinPad(app, title, sub, onComplete) {
      let val = "";
      const dots = h("div", { class: "pin-dots" }, [0, 1, 2, 3].map(() => h("span", {})));
      const upd = () => dots.querySelectorAll("span").forEach((s, i) => s.classList.toggle("on", i < val.length));
      function press(d) {
        if (val.length >= 4) return;
        val += d; haptic(); upd();
        if (val.length === 4) {
          const v = val;
          setTimeout(() => {
            const ok = onComplete(v);
            if (ok === false) {
              val = ""; upd();
              dots.classList.add("shake"); haptic("heavy");
              setTimeout(() => dots.classList.remove("shake"), 450);
            }
          }, 140);
        }
      }
      const pad = h("div", { class: "keypad" });
      ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].forEach(k => {
        if (k === "") { pad.append(h("button", { class: "key empty" }, "")); return; }
        pad.append(h("button", { class: "key", onclick: () => {
          if (k === "⌫") { val = val.slice(0, -1); upd(); haptic(); } else press(k);
        } }, k));
      });
      app.append(h("div", { class: "pin-wrap" },
        h("div", { class: "lock" }, "🔒"),
        h("h2", { class: "page-title", style: "margin-top:8px" }, title),
        h("div", { class: "sub", style: "margin-bottom:0" }, sub),
        dots, pad));
    }

    const GIFT_FIELDS = [
      { key: "text", label: "Что хочется", placeholder: "Например: Тёплый плед", required: true },
      { key: "for", label: "Для кого", type: "select", options: [["Макош", "Для Макош"], ["Иса", "Для Исы"]] },
      { key: "note", label: "Заметка или ссылка", type: "textarea", placeholder: "Размер, цвет, где купить" }
    ];

    function renderGifts(app) {
      const pin = (() => { try { return localStorage.getItem(PIN_KEY); } catch (e) { return null; } })();

      if (!pin) {
        const step2 = pinDraft !== null;
        pinPad(app, step2 ? "Повтори PIN-код" : "Придумай PIN-код", step2 ? "Введи те же 4 цифры ещё раз" : "4 цифры, которые закроют этот раздел", v => {
          if (!step2) { pinDraft = v; render(); return true; }
          if (v === pinDraft) {
            try { localStorage.setItem(PIN_KEY, hashPin(v)); } catch (e) {}
            pinDraft = null; giftsUnlocked = true; haptic("medium"); render(); return true;
          }
          pinDraft = null; toast("PIN-коды не совпали, попробуй заново", 2200); render(); return true;
        });
        return;
      }

      if (!giftsUnlocked) {
        pinPad(app, "Введи PIN-код", "Раздел «Идеи подарков» закрыт", v => {
          if (hashPin(v) === pin) { giftsUnlocked = true; haptic("medium"); render(); return true; }
          return false;
        });
        let armed = false;
        const forgot = h("button", { class: "linkbtn", style: "margin-top:24px" }, "Забыл PIN-код");
        forgot.onclick = () => {
          if (!armed) { armed = true; forgot.textContent = "Сброс удалит все идеи подарков. Нажми ещё раз"; return; }
          try { localStorage.removeItem(PIN_KEY); } catch (e) {}
          state.gifts = []; save(); render();
        };
        app.append(forgot);
        return;
      }

      app.append(h("h2", { class: "page-title" }, SECTIONS.gifts.emoji + " Идеи подарков"));
      app.append(h("div", { class: "sub" }, "Записывай, что хочется получить или подарить"));

      const chips = h("div", { class: "chips" });
      [["all", "Все"], ["Макош", "Для Макош"], ["Иса", "Для Исы"]].forEach(([val, name]) => {
        chips.append(h("button", { class: "chip" + (giftFilter === val ? " active" : ""), onclick: () => { giftFilter = val; render(); } }, name));
      });
      app.append(chips);

      const list = state.gifts.filter(g => giftFilter === "all" || g.for === giftFilter);
      if (!list.length) app.append(h("div", { class: "empty" }, h("span", { class: "big" }, "🎁"), "Пока пусто"));

      list.forEach((g, i) => {
        app.append(h("div", { class: "card", style: delay(Math.min(i, 8)), onclick: () => {
          openForm({
            title: "Изменить идею", fields: GIFT_FIELDS, values: g,
            onSave: v => { Object.assign(g, { text: v.text, for: v.for, note: v.note }); save(); },
            onDelete: () => { state.gifts = state.gifts.filter(x => x.id !== g.id); save(); }
          });
        } },
          h("div", { class: "tile sm", style: "background:" + SECTIONS.gifts.grad }, "🎁"),
          h("div", { class: "body" },
            h("div", { class: "name" }, g.text),
            h("div", { class: "meta" }, "Для " + (g.for === "Иса" ? "Исы" : "Макош")),
            g.note ? h("div", { class: "note" }, g.note) : null),
          h("div", { class: "arrow" }, "✎")));
      });

      addFab("+ Добавить идею", () => {
        openForm({
          title: "Новая идея", fields: GIFT_FIELDS,
          onSave: v => { state.gifts.push({ id: uid(), text: v.text, for: v.for, note: v.note }); save(); }
        });
      });
    }

    // =====================================================================
    //   ПЛЕЙЛИСТ
    // =====================================================================
    const SONG_FIELDS = [
      { key: "title", label: "Название песни", placeholder: "Например: Города", required: true },
      { key: "artist", label: "Исполнитель", placeholder: "Например: Thekitchensongs" }
    ];

    function renderPlaylist(app) {
      app.append(h("h2", { class: "page-title" }, SECTIONS.playlist.emoji + " Наш плейлист"));
      app.append(h("div", { class: "sub" }, "Песни, которые про нас. Кнопка ▶ откроет поиск на YouTube"));

      const all = SONGS.map(s => ({ id: s.id, title: s.title, artist: s.artist, custom: false }))
        .concat(state.songs.map(s => ({ id: s.id, title: s.title, artist: s.artist, custom: true })));

      all.forEach((s, i) => {
        const play = h("button", { class: "btn small", onclick: e => {
          e.stopPropagation();
          openLink("https://www.youtube.com/results?search_query=" + encodeURIComponent((s.artist + " " + s.title).trim()));
        } }, "▶");
        app.append(h("div", { class: "card", style: delay(Math.min(i, 8)), onclick: () => {
          if (!s.custom) return;
          const item = state.songs.find(x => x.id === s.id);
          openForm({
            title: "Изменить песню", fields: SONG_FIELDS, values: item,
            onSave: v => { item.title = v.title; item.artist = v.artist; save(); },
            onDelete: () => { state.songs = state.songs.filter(x => x.id !== s.id); save(); }
          });
        } },
          h("div", { class: "tile", style: "background:" + SECTIONS.playlist.grad }, "🎵"),
          h("div", { class: "body" }, h("div", { class: "name" }, s.title), h("div", { class: "meta" }, s.artist || "")),
          play));
      });

      addFab("+ Добавить песню", () => {
        openForm({
          title: "Новая песня", fields: SONG_FIELDS,
          onSave: v => { state.songs.push({ id: uid(), title: v.title, artist: v.artist }); save(); }
        });
      });
    }

    // =====================================================================
    //   СТАРТ
    // =====================================================================
    floaters();
    render();
    try { if (!localStorage.getItem("welcomed_v1")) showWelcome(); } catch (e) { showWelcome(); }
  </script>
</body>
</html>
