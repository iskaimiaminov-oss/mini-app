<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Для нас</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #8a8a8e);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --red: #e53935;
      --yellow: #f9a825;
      --green: #43a047;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px 16px 90px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    h1 { font-size: 24px; margin: 4px 0 4px; }
    h2 { font-size: 20px; margin: 4px 0 12px; }
    .sub { color: var(--hint); font-size: 14px; margin-bottom: 16px; }
    .card {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border-radius: 14px;
      padding: 16px; margin-bottom: 10px; cursor: pointer;
    }
    .card:active { opacity: .7; }
    .card .emoji { font-size: 26px; }
    .card .body { flex: 1; min-width: 0; }
    .card .name { font-weight: 600; font-size: 16px; }
    .card .meta { color: var(--hint); font-size: 13px; margin-top: 2px; }
    .card .arrow { color: var(--hint); font-size: 18px; }
    .note { color: var(--hint); font-size: 14px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
    .empty { color: var(--hint); text-align: center; padding: 30px 10px; }
    .fab {
      position: fixed; left: 16px; right: 16px; bottom: 16px;
      padding: 15px; font-size: 16px; font-weight: 600; border: 0;
      border-radius: 14px; background: var(--btn); color: var(--btn-text);
    }
    .btn {
      padding: 12px 16px; font-size: 15px; font-weight: 600; border: 0;
      border-radius: 12px; background: var(--btn); color: var(--btn-text);
    }
    .btn.ghost { background: var(--card); color: var(--text); }
    .btn.danger { background: var(--red); color: #fff; }
    .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }
    .legend { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--hint); margin-bottom: 14px; }
    .legend div { display: flex; align-items: center; gap: 8px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
    .chip {
      flex: none; padding: 8px 14px; border-radius: 20px; border: 0;
      background: var(--card); color: var(--text); font-size: 14px;
    }
    .chip.active { background: var(--btn); color: var(--btn-text); }
    .badge {
      display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px;
      background: var(--btn); color: var(--btn-text); margin-top: 4px;
    }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    .row .btn { flex: 1; }
    .section-title { font-size: 15px; font-weight: 600; margin: 18px 0 8px; }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; z-index: 10;
    }
    .sheet {
      width: 100%; max-height: 92vh; overflow-y: auto;
      background: var(--bg); border-radius: 18px 18px 0 0; padding: 18px 16px 24px;
    }
    .sheet h3 { margin: 0 0 14px; font-size: 18px; }
    label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 4px; }
    input, textarea, select {
      width: 100%; padding: 12px; font-size: 16px; border-radius: 10px;
      border: 1px solid #8883; background: var(--card); color: var(--text);
      font-family: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    .levels { display: flex; gap: 8px; }
    .level {
      flex: 1; padding: 12px 6px; border-radius: 10px; border: 2px solid transparent;
      background: var(--card); color: var(--text); font-size: 13px; text-align: center;
    }
    .level.sel.red { border-color: var(--red); }
    .level.sel.yellow { border-color: var(--yellow); }
    .level.sel.green { border-color: var(--green); }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    .actions .btn { flex: 1; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ---------- Данные ----------
    const KEY = "isa_makosh_v1";

    const SECTIONS = {
      dates:  { emoji: "📅", title: "Важные даты" },
      trips:  { emoji: "✈️", title: "Наши поездки с воспоминаниями" },
      our:    { emoji: "💞", title: "Наши предпочтения" },
      isa:    { emoji: "🧔", title: "Предпочтения Исы" },
      makosh: { emoji: "🌸", title: "Предпочтения Макош" }
    };

    const LEVELS = {
      red:    { name: "Красный",  hint: "важно" },
      yellow: { name: "Жёлтый",   hint: "не сильно, но желательно" },
      green:  { name: "Зелёный",  hint: "предпочтительно, но можно и без этого" }
    };
    const LEVEL_ORDER = { red: 0, yellow: 1, green: 2 };

    function defaultState() {
      const trips = [];
      for (let i = 1; i <= 10; i++) {
        trips.push({ id: "t" + i, title: "Поездка " + i, place: "", when: "", notes: "", memories: [] });
      }
      return { dates: [], trips: trips, prefs: { our: [], isa: [], makosh: [] } };
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const s = JSON.parse(raw);
          const d = defaultState();
          return {
            dates: s.dates || d.dates,
            trips: s.trips || d.trips,
            prefs: Object.assign(d.prefs, s.prefs || {})
          };
        }
      } catch (e) {}
      return defaultState();
    }

    let state = load();

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    // ---------- Помощники ----------
    function h(tag, attrs, ...children) {
      const e = document.createElement(tag);
      for (const k in (attrs || {})) {
        if (k === "class") e.className = attrs[k];
        else if (k.startsWith("on")) e[k] = attrs[k];
        else e.setAttribute(k, attrs[k]);
      }
      children.flat().forEach(c => {
        if (c == null || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(c));
      });
      return e;
    }

    function haptic(type) {
      try { tg.HapticFeedback.impactOccurred(type || "light"); } catch (e) {}
    }

    function formatDate(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return d + "." + m + "." + y;
    }

    function daysUntil(item) {
      if (!item.date) return null;
      const [y, m, d] = item.date.split("-").map(Number);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      let target = new Date(y, m - 1, d);
      if (item.repeat === "yearly") {
        target = new Date(today.getFullYear(), m - 1, d);
        if (target < today) target = new Date(today.getFullYear() + 1, m - 1, d);
      }
      return Math.round((target - today) / 86400000);
    }

    function daysLabel(n) {
      if (n === null) return "";
      if (n === 0) return "Сегодня! 🎉";
      if (n === 1) return "Завтра";
      if (n > 1) return "Через " + n + " дн.";
      return "Прошло " + Math.abs(n) + " дн. назад";
    }

    // ---------- Модальное окно с формой ----------
    // fields: [{key, label, type: text|date|textarea|select|level, options}]
    function openForm(opts) {
      const values = Object.assign({}, opts.values || {});
      const inputs = {};
      const body = h("div", {});
      body.append(h("h3", {}, opts.title));

      opts.fields.forEach(f => {
        body.append(h("label", {}, f.label));
        if (f.type === "level") {
          if (!values[f.key]) values[f.key] = "red";
          const wrap = h("div", { class: "levels" });
          Object.keys(LEVELS).forEach(k => {
            const b = h("button", { type: "button", class: "level " + k }, 
              h("div", { class: "dot " + k, style: "margin:0 auto 6px" }),
              LEVELS[k].name, h("div", { style: "font-size:11px;color:var(--hint);margin-top:2px" }, LEVELS[k].hint));
            b.onclick = () => {
              values[f.key] = k;
              wrap.querySelectorAll(".level").forEach(x => x.classList.remove("sel"));
              b.classList.add("sel");
              haptic();
            };
            if (values[f.key] === k) b.classList.add("sel");
            wrap.append(b);
          });
          body.append(wrap);
        } else if (f.type === "select") {
          const s = h("select", {}, f.options.map(o => h("option", { value: o[0] }, o[1])));
          s.value = values[f.key] || f.options[0][0];
          inputs[f.key] = s;
          body.append(s);
        } else if (f.type === "textarea") {
          const t = h("textarea", { placeholder: f.placeholder || "" });
          t.value = values[f.key] || "";
          inputs[f.key] = t;
          body.append(t);
        } else {
          const i = h("input", { type: f.type || "text", placeholder: f.placeholder || "" });
          i.value = values[f.key] || "";
          inputs[f.key] = i;
          body.append(i);
        }
      });

      const overlay = h("div", { class: "overlay" }, h("div", { class: "sheet" }, body));
      const close = () => overlay.remove();
      overlay.onclick = e => { if (e.target === overlay) close(); };

      const actions = h("div", { class: "actions" });
      actions.append(h("button", { class: "btn ghost", onclick: close }, "Отмена"));
      actions.append(h("button", { class: "btn", onclick: () => {
        const out = Object.assign({}, values);
        for (const k in inputs) out[k] = inputs[k].value.trim();
        const firstRequired = opts.fields.find(f => f.required);
        if (firstRequired && !out[firstRequired.key]) {
          inputs[firstRequired.key].focus();
          return;
        }
        opts.onSave(out);
        haptic("medium");
        close();
        render();
      } }, "Сохранить"));
      body.append(actions);

      if (opts.onDelete) {
        let armed = false;
        const del = h("button", { class: "btn danger", style: "width:100%;margin-top:10px" }, "Удалить");
        del.onclick = () => {
          if (!armed) { armed = true; del.textContent = "Нажми ещё раз, чтобы удалить"; return; }
          opts.onDelete();
          close();
          if (opts.afterDelete) opts.afterDelete();
          render();
        };
        body.append(del);
      }

      document.body.append(overlay);
    }

    // ---------- Навигация ----------
    let stack = [{ name: "home" }];

    function go(name, param) {
      stack.push({ name, param });
      render();
      window.scrollTo(0, 0);
    }

    function back() {
      if (stack.length > 1) { stack.pop(); render(); window.scrollTo(0, 0); }
    }

    tg.BackButton.onClick(back);

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = "";
      document.querySelectorAll(".fab").forEach(e => e.remove());
      const cur = stack[stack.length - 1];

      if (stack.length > 1) tg.BackButton.show(); else tg.BackButton.hide();

      if (cur.name === "home") renderHome(app);
      else if (cur.name === "dates") renderDates(app);
      else if (cur.name === "trips") renderTrips(app);
      else if (cur.name === "trip") renderTrip(app, cur.param);
      else if (cur.name === "prefs") renderPrefs(app, cur.param);
    }

    function addFab(text, onclick) {
      document.body.append(h("button", { class: "fab", onclick }, text));
    }

    // ---------- Главный экран ----------
    function renderHome(app) {
      app.append(h("h1", { style: "font-size:20px;line-height:1.35;margin:4px 0 18px" }, "Это приложение создано для нашего удобства и заботы друг о друге ❤️"));

      const counts = {
        dates: state.dates.length,
        trips: state.trips.filter(t => t.place || t.when || t.notes || t.memories.length).length,
        our: state.prefs.our.length,
        isa: state.prefs.isa.length,
        makosh: state.prefs.makosh.length
      };

      Object.keys(SECTIONS).forEach(key => {
        const s = SECTIONS[key];
        const card = h("div", { class: "card", onclick: () => {
          haptic();
          if (key === "dates") go("dates");
          else if (key === "trips") go("trips");
          else go("prefs", key);
        } },
          h("div", { class: "emoji" }, s.emoji),
          h("div", { class: "body" },
            h("div", { class: "name" }, s.title),
            h("div", { class: "meta" }, key === "trips" ? "Заполнено: " + counts[key] + " из " + state.trips.length : "Записей: " + counts[key])),
          h("div", { class: "arrow" }, "›"));
        app.append(card);
      });
    }

    // ---------- Важные даты ----------
    const DATE_FIELDS = [
      { key: "title", label: "Название", placeholder: "Например: День рождения", required: true },
      { key: "date", label: "Дата", type: "date" },
      { key: "repeat", label: "Повтор", type: "select", options: [["", "Не повторяется"], ["yearly", "Каждый год"]] },
      { key: "note", label: "Заметка", type: "textarea", placeholder: "Что важно помнить" }
    ];

    function renderDates(app) {
      app.append(h("h2", {}, "📅 Важные даты"));

      if (!state.dates.length) {
        app.append(h("div", { class: "empty" }, "Пока пусто.\nДобавь первую дату кнопкой ниже."));
      }

      const sorted = state.dates.slice().sort((a, b) => {
        const da = daysUntil(a), db = daysUntil(b);
        if (da === null) return 1; if (db === null) return -1;
        const pa = da < 0, pb = db < 0;
        if (pa !== pb) return pa ? 1 : -1;
        return pa ? db - da : da - db;
      });

      sorted.forEach(item => {
        const n = daysUntil(item);
        app.append(h("div", { class: "card", onclick: () => editDate(item) },
          h("div", { class: "body" },
            h("div", { class: "name" }, item.title),
            h("div", { class: "meta" }, formatDate(item.date) + (item.repeat === "yearly" ? " · каждый год" : "")),
            n !== null ? h("span", { class: "badge" }, daysLabel(n)) : null,
            item.note ? h("div", { class: "note" }, item.note) : null),
          h("div", { class: "arrow" }, "✎")));
      });

      addFab("+ Добавить дату", () => {
        openForm({
          title: "Новая дата", fields: DATE_FIELDS,
          onSave: v => { state.dates.push({ id: uid(), title: v.title, date: v.date, repeat: v.repeat, note: v.note }); save(); }
        });
      });
    }

    function editDate(item) {
      openForm({
        title: "Изменить дату", fields: DATE_FIELDS, values: item,
        onSave: v => { Object.assign(item, { title: v.title, date: v.date, repeat: v.repeat, note: v.note }); save(); },
        onDelete: () => { state.dates = state.dates.filter(x => x.id !== item.id); save(); }
      });
    }

    // ---------- Поездки ----------
    const TRIP_FIELDS = [
      { key: "title", label: "Название поездки", placeholder: "Например: Стамбул 2025", required: true },
      { key: "place", label: "Место", placeholder: "Страна, город" },
      { key: "when", label: "Когда", placeholder: "Например: июль 2025" },
      { key: "notes", label: "Общее описание", type: "textarea", placeholder: "Как всё было" }
    ];

    function renderTrips(app) {
      app.append(h("h2", {}, "✈️ Наши поездки"));
      app.append(h("div", { class: "sub" }, "Открой поездку, чтобы заполнить её и добавить воспоминания"));

      state.trips.forEach((t, i) => {
        const filled = t.place || t.when || t.notes || t.memories.length;
        app.append(h("div", { class: "card", onclick: () => { haptic(); go("trip", t.id); } },
          h("div", { class: "emoji" }, filled ? "📸" : "🗺️"),
          h("div", { class: "body" },
            h("div", { class: "name" }, t.title),
            h("div", { class: "meta" },
              [t.place, t.when].filter(Boolean).join(" · ") || "Ещё не заполнено",
              t.memories.length ? " · воспоминаний: " + t.memories.length : "")),
          h("div", { class: "arrow" }, "›")));
      });

      addFab("+ Добавить поездку", () => {
        openForm({
          title: "Новая поездка", fields: TRIP_FIELDS,
          onSave: v => { state.trips.push({ id: uid(), title: v.title, place: v.place, when: v.when, notes: v.notes, memories: [] }); save(); }
        });
      });
    }

    const MEMORY_FIELDS = [
      { key: "text", label: "Воспоминание", type: "textarea", placeholder: "Что запомнилось", required: true }
    ];

    function renderTrip(app, id) {
      const trip = state.trips.find(t => t.id === id);
      if (!trip) { back(); return; }

      app.append(h("h2", {}, trip.title));
      if (trip.place || trip.when) app.append(h("div", { class: "sub" }, [trip.place, trip.when].filter(Boolean).join(" · ")));
      if (trip.notes) app.append(h("div", { class: "note", style: "margin-bottom:12px" }, trip.notes));

      app.append(h("div", { class: "row" },
        h("button", { class: "btn ghost", onclick: () => {
          openForm({
            title: "Данные поездки", fields: TRIP_FIELDS, values: trip,
            onSave: v => { Object.assign(trip, { title: v.title, place: v.place, when: v.when, notes: v.notes }); save(); },
            onDelete: () => { state.trips = state.trips.filter(t => t.id !== trip.id); save(); },
            afterDelete: () => { stack.pop(); }
          });
        } }, "✎ Изменить данные")));

      app.append(h("div", { class: "section-title" }, "Воспоминания"));
      if (!trip.memories.length) app.append(h("div", { class: "empty" }, "Воспоминаний пока нет"));

      trip.memories.forEach(m => {
        app.append(h("div", { class: "card", onclick: () => {
          openForm({
            title: "Воспоминание", fields: MEMORY_FIELDS, values: m,
            onSave: v => { m.text = v.text; save(); },
            onDelete: () => { trip.memories = trip.memories.filter(x => x.id !== m.id); save(); }
          });
        } }, h("div", { class: "body" }, h("div", { class: "note", style: "margin:0;color:var(--text)" }, m.text))));
      });

      addFab("+ Добавить воспоминание", () => {
        openForm({
          title: "Новое воспоминание", fields: MEMORY_FIELDS,
          onSave: v => { trip.memories.push({ id: uid(), text: v.text }); save(); }
        });
      });
    }

    // ---------- Предпочтения ----------
    const prefFilter = { our: "all", isa: "all", makosh: "all" };

    const PREF_FIELDS = [
      { key: "text", label: "Предпочтение", type: "textarea", placeholder: "Например: любит кофе без сахара", required: true },
      { key: "level", label: "Важность", type: "level" }
    ];

    function renderPrefs(app, key) {
      const s = SECTIONS[key];
      app.append(h("h2", {}, s.emoji + " " + s.title));

      const legend = h("div", { class: "legend" });
      Object.keys(LEVELS).forEach(k => {
        legend.append(h("div", {}, h("div", { class: "dot " + k }), LEVELS[k].name + " — " + LEVELS[k].hint));
      });
      app.append(legend);

      const chips = h("div", { class: "chips" });
      [["all", "Все"], ["red", "🔴 Важно"], ["yellow", "🟡 Желательно"], ["green", "🟢 Можно без"]].forEach(([val, name]) => {
        chips.append(h("button", {
          class: "chip" + (prefFilter[key] === val ? " active" : ""),
          onclick: () => { prefFilter[key] = val; render(); }
        }, name));
      });
      app.append(chips);

      let list = state.prefs[key].slice();
      if (prefFilter[key] !== "all") list = list.filter(p => p.level === prefFilter[key]);
      list.sort((a, b) => LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level]);

      if (!list.length) app.append(h("div", { class: "empty" }, "Здесь пока ничего нет"));

      list.forEach(p => {
        app.append(h("div", { class: "card", onclick: () => {
          openForm({
            title: "Изменить предпочтение", fields: PREF_FIELDS, values: p,
            onSave: v => { p.text = v.text; p.level = v.level; save(); },
            onDelete: () => { state.prefs[key] = state.prefs[key].filter(x => x.id !== p.id); save(); }
          });
        } },
          h("div", { class: "dot " + p.level }),
          h("div", { class: "body" }, h("div", { class: "name", style: "font-weight:500;white-space:pre-wrap;word-break:break-word" }, p.text))));
      });

      addFab("+ Добавить предпочтение", () => {
        openForm({
          title: "Новое предпочтение", fields: PREF_FIELDS,
          onSave: v => { state.prefs[key].push({ id: uid(), text: v.text, level: v.level }); save(); }
        });
      });
    }

    render();
  </script>
</body>
</html>
